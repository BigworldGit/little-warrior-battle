    function spawnHitEffect(pos) {
        const ring = new THREE.Mesh(fxGeos.ringSmall, fxMats.hitRing.clone());
        ring.position.copy(pos); ring.position.y = 1.5;
        ring.rotation.x = -Math.PI / 2;
        scene.add(ring);
        const hitLight = new THREE.PointLight(0xffddaa, 5.0, 8);
        hitLight.position.copy(pos);
        hitLight.position.y = 1.5;
        scene.add(hitLight);
        effects.push({ mesh: ring, type: 'ring', life: 0, maxLife: 0.5, light: hitLight, maxLightIntensity: 5.0 });

        for (let i = 0; i < 8; i++) {
            const isStar = i % 3 === 0;
            const spark = new THREE.Mesh(
                isStar ? fxGeos.star : fxGeos.spark,
                fxMats.spark[i % fxMats.spark.length].clone()
            );
            spark.position.copy(pos);
            spark.position.y = 1.2 + Math.random() * 0.75;
            const vel = new THREE.Vector3((Math.random()-0.5)*5.5, Math.random()*4.2, (Math.random()-0.5)*5.5);
            scene.add(spark);
            effects.push({ mesh: spark, type: 'spark', vel, life: 0, maxLife: 0.4 + Math.random()*0.3 });
        }
    }

    function spawnSlashEffect(char, facingRight) {
        const weapon = weaponData[char === char1 ? localPlayer.weapon : remotePlayer.weapon] || weaponData[0];
        const dir = facingRight ? 1 : -1;
        const addLight = (mesh, color, intensity) => {
            const light = new THREE.PointLight(color, intensity, 6);
            light.position.copy(mesh.position);
            scene.add(light);
            return light;
        };
        if (weapon.kind === 'heavy') {
            const shock = new THREE.Mesh(fxGeos.shock, fxMats.shock.clone());
            shock.position.copy(char.position);
            shock.position.x += dir * 0.65;
            shock.position.y = 0.09;
            shock.rotation.x = -Math.PI / 2;
            scene.add(shock);
            const light = addLight(shock, 0xffa500, 3.5);
            effects.push({ mesh: shock, type: 'shock', life: 0, maxLife: 0.42, light, maxLightIntensity: 3.5 });
            return;
        }
        if (weapon.kind === 'polearm') {
            const thrust = new THREE.Mesh(
                fxGeos.thrust,
                new THREE.MeshBasicMaterial({ color: weapon.accent, transparent: true, opacity: 0.78 })
            );
            thrust.position.copy(char.position);
            thrust.position.x += dir * 1.32;
            thrust.position.y = 1.62;
            thrust.rotation.z = facingRight ? -Math.PI / 2 : Math.PI / 2;
            scene.add(thrust);
            const light = addLight(thrust, weapon.accent, 2.5);
            effects.push({ mesh: thrust, type: 'thrust', life: 0, maxLife: 0.28, dir, light, maxLightIntensity: 2.5 });
            return;
        }
        if (weapon.kind === 'magic') {
            const burst = new THREE.Mesh(
                fxGeos.burst,
                new THREE.MeshBasicMaterial({ color: weapon.color, transparent: true, opacity: 0.5 })
            );
            burst.position.copy(char.position);
            burst.position.x += dir * 1.05;
            burst.position.y = 1.65;
            scene.add(burst);
            const light = addLight(burst, weapon.color, 4.0);
            effects.push({ mesh: burst, type: 'burst', life: 0, maxLife: 0.34, light, maxLightIntensity: 4.0 });
            return;
        }

        const slash = new THREE.Mesh(
            fxGeos.slash,
            new THREE.MeshBasicMaterial({ color: weapon.accent || 0xffffff, transparent: true, opacity: weapon.kind === 'melee' ? 0.82 : 0.7, side: THREE.DoubleSide })
        );
        slash.position.copy(char.position);
        slash.position.y = 1.72;
        slash.position.x += dir * (weapon.name.includes('拳') ? 0.72 : 1.08);
        slash.position.z += weapon.name.includes('冰') ? -0.18 : 0.18;
        slash.rotation.y = facingRight ? 0 : Math.PI;
        slash.rotation.z = facingRight ? -0.28 : 0.28;
        if (weapon.name.includes('火')) slash.scale.set(1.1, 0.85, 1.1);
        if (weapon.name.includes('冰')) slash.scale.set(0.82, 1.24, 0.82);
        if (weapon.name.includes('拳')) slash.scale.set(0.58, 0.58, 0.58);
        scene.add(slash);
        const light = addLight(slash, weapon.accent || 0xffffff, 3.0);
        effects.push({ mesh: slash, type: weapon.name.includes('拳') ? 'punch' : 'slash', life: 0, maxLife: 0.34, light, maxLightIntensity: 3.0 });
    }

    function spawnArrowEffect(char, facingRight, weaponIndex) {
        const weapon = weaponData[weaponIndex] || weaponData[3];
        const arrow = makeArrowMesh(weapon.color, weapon.accent, 1.28);
        const dir = facingRight ? 1 : -1;
        arrow.position.copy(char.position);
        arrow.position.x += dir * 0.75;
        arrow.position.y = 1.72;
        arrow.position.z += 0.16;
        arrow.rotation.y = facingRight ? 0 : Math.PI;
        scene.add(arrow);

        const trail = new THREE.Mesh(
            new THREE.CylinderGeometry(0.025, 0.08, 1.1, 8),
            new THREE.MeshBasicMaterial({ color: weapon.accent, transparent: true, opacity: 0.46 })
        );
        trail.rotation.z = Math.PI / 2;
        trail.position.x = -dir * 0.55;
        arrow.add(trail);

        const light = new THREE.PointLight(weapon.accent, 2.5, 5);
        light.position.copy(arrow.position);
        scene.add(light);

        effects.push({
            mesh: arrow,
            type: 'arrow',
            vel: new THREE.Vector3(dir * 18, 0.18, 0),
            life: 0,
            maxLife: 0.62,
            disposeGeometry: true,
            light,
            maxLightIntensity: 2.5
        });
    }

    function updateEffects(dt) {
        for (let i = effects.length - 1; i >= 0; i--) {
            const e = effects[i];
            e.life += dt;
            const t = e.life / e.maxLife;
            if (e.light) e.light.intensity = e.maxLightIntensity * (1 - Math.pow(t, 2));
            if (t >= 1) {
                scene.remove(e.mesh);
                if (e.light) scene.remove(e.light);
                e.mesh.traverse?.(obj => {
                    if (e.disposeGeometry && obj.geometry) obj.geometry.dispose();
                    if (obj.material?.dispose) obj.material.dispose();
                });
                if (e.mesh.material?.dispose) e.mesh.material.dispose();
                effects.splice(i, 1);
                continue;
            }
            if (e.type === 'ring') {
                const s = 1 + t * 4;
                e.mesh.scale.set(s, s, s);
                e.mesh.material.opacity = 1 - t;
            } else if (e.type === 'spark') {
                e.mesh.position.add(e.vel.clone().multiplyScalar(dt));
                e.vel.y -= 15 * dt;
                e.mesh.rotation.x += dt * 8;
                e.mesh.rotation.y += dt * 11;
                e.mesh.material.opacity = 1 - t;
            } else if (e.type === 'slash') {
                e.mesh.material.opacity = 1 - t;
                const s = 1 + t * 0.75;
                e.mesh.scale.set(s, s, s);
                e.mesh.rotation.z += dt * 4;
            } else if (e.type === 'punch') {
                e.mesh.material.opacity = 1 - t;
                const s = 0.62 + t * 0.85;
                e.mesh.scale.set(s, s, s);
                e.mesh.position.x += (e.mesh.rotation.y === 0 ? 1 : -1) * dt * 1.8;
                if (e.light) e.light.position.copy(e.mesh.position);
            } else if (e.type === 'shock') {
                e.mesh.material.opacity = 0.78 * (1 - t);
                const s = 1 + t * 3.6;
                e.mesh.scale.set(s, s, s);
            } else if (e.type === 'thrust') {
                e.mesh.material.opacity = 0.78 * (1 - t);
                e.mesh.position.x += e.dir * dt * 4.5;
                e.mesh.scale.set(1 + t * 0.35, 1 + t * 0.9, 1 + t * 0.35);
                if (e.light) e.light.position.copy(e.mesh.position);
            } else if (e.type === 'burst') {
                e.mesh.material.opacity = 0.5 * (1 - t);
                const s = 0.7 + t * 2.2;
                e.mesh.scale.set(s, s, s);
            } else if (e.type === 'arrow') {
                const prevX = e.mesh.position.x;
                e.mesh.position.add(e.vel.clone().multiplyScalar(dt));
                e.mesh.position.y += Math.sin(t * Math.PI) * 0.012;
                e.mesh.scale.setScalar(1 + t * 0.18);
                if (e.light) e.light.position.copy(e.mesh.position);
                
                // Collision detection with opponent
                const arrowX = e.mesh.position.x;
                const oppX = remotePlayer.x;
                const weapon = weaponData[localPlayer.weapon];
                if (!e.hit && Math.abs(arrowX - oppX) < 0.8 && e.mesh.position.y < 2.5 && e.mesh.position.y > 0.5) {
                    e.hit = true;
                    const dmg = weapon.power;
                    socket.emit('gameAction', { roomId, action: { type: 'hit', damage: dmg } });
                    if (char2) { spawnHitEffect(char2.position); cameraShake(0.15); }
                    remotePlayer.health = Math.max(0, remotePlayer.health - dmg);
                    remotePlayer.hurt = true;
                    updateHealthUI('opponent');
                    setTimeout(() => { remotePlayer.hurt = false; }, 300);
                    if (remotePlayer.health <= 0) endGame(true);
                    
                    // Remove arrow early on hit
                    e.life = e.maxLife; 
                }

                e.mesh.children.forEach(child => {
                    if (child.material?.opacity !== undefined) child.material.opacity = Math.max(0, 0.46 * (1 - t));
                });
            }
        }
    }

    let shakeTimer = 0;
    let shakePower = 0;
    function cameraShake(intensity) {
        shakeTimer = 0.28;
        shakePower = Math.max(shakePower, intensity);
    }

    function showDamagePopup(damage, screenX, screenY) {
        const popup = document.createElement('div');
        popup.className = 'dmg-popup';
        popup.textContent = damage > 0 ? `+${damage}` : `${damage}`;
        popup.style.color = damage > 0 ? '#69db7c' : '#ff6b6b';
        popup.style.left = screenX + 'px';
        popup.style.top = screenY + 'px';
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 800);
    }

    /* ═══════════════════════════════════════════
       SKY DROPS
    ═══════════════════════════════════════════ */
    const drops = new Map();
    let nextDropAt = 0;
    const dropGeo = {
        health: new THREE.BoxGeometry(0.55, 0.55, 0.55),
        meteor: new THREE.DodecahedronGeometry(0.46, 0),
        crossV: new THREE.BoxGeometry(0.12, 0.62, 0.58),
        crossH: new THREE.BoxGeometry(0.38, 0.13, 0.6),
        flame: new THREE.ConeGeometry(0.45, 1.25, 10)
    };
    const dropMat = {
        health: new THREE.MeshStandardMaterial({ color: 0xff5f7e, emissive: 0xff1744, emissiveIntensity: 0.28, roughness: 0.42 }),
        meteor: new THREE.MeshStandardMaterial({ color: 0x5d4037, emissive: 0xff6d00, emissiveIntensity: 0.32, roughness: 0.78, flatShading: true }),
        cross: new THREE.MeshBasicMaterial({ color: 0xffffff }),
        flame: new THREE.MeshBasicMaterial({ color: 0xffb703, transparent: true, opacity: 0.44, side: THREE.DoubleSide })
    };

    function createDropMesh(type) {
        const g = new THREE.Group();
        if (type === 'health') {
            // High quality medical kit
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }));
            box.castShadow = true;
            g.add(box);
            const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.45, 0.62), new THREE.MeshStandardMaterial({ color: 0x2ecc71, emissive: 0x2ecc71, emissiveIntensity: 0.5 }));
            const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.15, 0.62), new THREE.MeshStandardMaterial({ color: 0x2ecc71, emissive: 0x2ecc71, emissiveIntensity: 0.5 }));
            g.add(crossV, crossH);
            const light = new THREE.PointLight(0x2ecc71, 1.2, 4);
            g.add(light);
            g.userData.isHealth = true;
        } else {
            const rock = new THREE.Mesh(dropGeo.meteor, dropMat.meteor);
            rock.castShadow = true;
            g.add(rock);
            const flame = new THREE.Mesh(dropGeo.flame, dropMat.flame.clone());
            flame.position.y = 0.6;
            g.add(flame);
            const light = new THREE.PointLight(0xff8a00, 1.5, 6);
            g.add(light);
            g.userData.rock = rock; // Only rotate this
        }
        return g;
    }

    function spawnSkyDrop(data) {
        if (drops.has(data.id)) return;
        const mesh = createDropMesh(data.type);
        mesh.position.set(data.x, 12, data.z);
        scene.add(mesh);
        drops.set(data.id, {
            id: data.id,
            type: data.type,
            mesh,
            yVel: data.type === 'meteor' ? -8.6 : -4.4,
            collected: false,
            landedAt: 0
        });
    }

    function scheduleNextDrop(time) {
        nextDropAt = time + 4.5 + Math.random() * 3.5;
    }

    function maybeHostDrop(time) {
        if (!gameStarted || myPlayerNum !== 1 || time < nextDropAt) return;
        const data = {
            id: `${roomId}_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
            type: Math.random() < 0.52 ? 'health' : 'meteor',
            x: -10.5 + Math.random() * 21,
            z: COMBAT_Z
        };
        spawnSkyDrop(data);
        socket.emit('gameAction', { roomId, action: { type: 'dropSpawn', drop: data } });
        scheduleNextDrop(time);
    }

    function removeDrop(id) {
        const drop = drops.get(id);
        if (!drop) return;
        scene.remove(drop.mesh);
        drop.mesh.traverse(obj => { if (obj.material?.dispose && obj.material !== dropMat.health && obj.material !== dropMat.meteor && obj.material !== dropMat.cross) obj.material.dispose(); });
        drops.delete(id);
    }

    function applyDropToLocal(drop) {
        if (drop.collected) return;
        drop.collected = true;
        const intendedDelta = drop.type === 'health' ? 20 : -20;
        const before = localPlayer.health;
        localPlayer.health = Math.max(0, Math.min(localPlayer.maxHealth, localPlayer.health + intendedDelta));
        const delta = localPlayer.health - before;
        updateHealthUI('player');
        cameraShake(drop.type === 'meteor' ? 0.32 : 0.12);
        if (delta !== 0) {
            const v = char1.position.clone().project(camera);
            showDamagePopup(delta, (v.x * 0.5 + 0.5) * window.innerWidth, (-v.y * 0.5 + 0.5) * window.innerHeight);
        }
        socket.emit('gameAction', { roomId, action: { type: 'dropCollect', id: drop.id, dropType: drop.type, health: localPlayer.health } });
        removeDrop(drop.id);
        if (localPlayer.health <= 0) endGame(false);
    }

    function updateDrops(dt, time) {
        maybeHostDrop(time);
        drops.forEach(drop => {
            drop.mesh.position.y += drop.yVel * dt;
            if (drop.mesh.userData.rock) {
                drop.mesh.userData.rock.rotation.y += dt * 4.2;
                drop.mesh.userData.rock.rotation.x += dt * 2.5;
            } else if (drop.type === 'health') {
                drop.mesh.rotation.y += dt * 1.8;
                drop.mesh.position.y += Math.sin(time * 4 + drop.mesh.position.x) * 0.004;
            }
            if (drop.mesh.position.y <= 0.65 && !drop.landedAt) {
                drop.mesh.position.y = 0.65;
                drop.landedAt = time;
                if (drop.type === 'meteor') {
                    const shock = new THREE.Mesh(fxGeos.shock, fxMats.shock.clone());
                    shock.position.set(drop.mesh.position.x, 0.08, drop.mesh.position.z);
                    shock.rotation.x = -Math.PI / 2;
                    scene.add(shock);
                    effects.push({ mesh: shock, type: 'shock', life: 0, maxLife: 0.34 });
                }
            }
            if (!drop.collected && char1 && drop.mesh.position.y < 1.35) {
                const dist = Math.abs(localPlayer.x - drop.mesh.position.x);
                if (dist < (drop.type === 'meteor' ? 1.05 : 0.9)) applyDropToLocal(drop);
            }
            if (drop.landedAt && time - drop.landedAt > (drop.type === 'meteor' ? 1.1 : 8)) removeDrop(drop.id);
        });
    }

    /* ═══════════════════════════════════════════
       ANIMATION HELPERS
    ═══════════════════════════════════════════ */
    function animateCharacter(char, state, time) {
        const d = char.userData;
        if (state.hurt) {
            // Flash effect
            const flash = Math.sin(time * 40) > 0;
            d.body.material.emissive.setHex(flash ? 0xff0000 : 0x000000);
            d.head.material.emissive.setHex(flash ? 0xff0000 : 0x000000);
            d.chest.material.emissive.setHex(flash ? 0xffd166 : 0x000000);
        } else {
            d.body.material.emissive.setHex(0x000000);
            d.head.material.emissive.setHex(0x000000);
            d.chest.material.emissive.setHex(0x000000);
        }

        const isMoving = Math.abs(state.vx) > 0.02;
        const bounce = Math.sin(time * (isMoving ? 13 : 3.2)) * (isMoving ? 0.075 : 0.026);
        const sway = Math.sin(time * (isMoving ? 8 : 2)) * (isMoving ? 0.32 : 0.07);
        d.cape.rotation.x = 0.18 + Math.abs(sway) * 0.08;
        d.cape.rotation.z = Math.sin(time * 3) * 0.04;
        d.contact.scale.set(1 + Math.abs(bounce) * 0.3, 0.72 + Math.abs(bounce) * 0.15, 1);

        if (state.attacking) {
            const weapon = weaponData[state.weapon] || weaponData[0];
            const attackAge = state.attackStart >= 0 ? Math.max(0, time - state.attackStart) : 0;
            const windup = Math.min(1, attackAge / 0.16);
            const release = Math.min(1, Math.max(0, (attackAge - 0.12) / 0.18));
            const swing = Math.sin(Math.min(1, release) * Math.PI);

            if (weapon.kind === 'bow') {
                if (d.armL) { d.armL.rotation.z = 0.85; d.armL.rotation.x = -0.42; }
                if (d.armR) { d.armR.rotation.z = -1.35 + windup * 0.28; d.armR.rotation.x = -0.86; }
                if (d.handR) d.handR.position.set(0.5 - windup * 0.22, 1.55, 0.48);
                if (d.weaponGroup) {
                    d.weaponGroup.position.set(0.52, 1.6, 0.4);
                    d.weaponGroup.rotation.set(0, 0, -0.18 + windup * 0.2);
                }
                char.rotation.z = state.facingRight ? -0.08 : 0.08;
            } else if (weapon.kind === 'heavy') {
                if (d.armR) {
                    d.armR.rotation.z = -1.25 - swing * 0.9;
                    d.armR.rotation.x = -1.2 + swing * 1.3;
                    d.armR.position.z = 0.2 + swing * 0.4;
                }
                if (d.handR) d.handR.position.set(0.72, 1.38 + swing * 0.28, 0.24 + swing * 0.54);
                if (d.shoulderR) d.shoulderR.rotation.x = -0.7 - swing * 0.55;
                if (d.weaponGroup) {
                    d.weaponGroup.position.set(0.76 + swing * 0.18, 2.05 - swing * 0.34, 0.56 + swing * 0.35);
                    d.weaponGroup.rotation.set(-0.9 + swing * 1.55, 0, -0.55 + swing * 0.65);
                }
                char.position.y = Math.sin(Math.min(1, release) * Math.PI) * 0.09;
                char.rotation.z = state.facingRight ? -0.22 * swing : 0.22 * swing;
            } else if (weapon.kind === 'polearm') {
                if (d.armR) { d.armR.rotation.z = -0.62; d.armR.rotation.x = -0.72; }
                if (d.handR) d.handR.position.set(0.78 + swing * 0.22, 1.42, 0.48 + swing * 0.46);
                if (d.shoulderR) d.shoulderR.rotation.x = -0.3;
                if (d.weaponGroup) {
                    d.weaponGroup.position.set(0.9, 1.95, 0.72 + swing * 0.68);
                    d.weaponGroup.rotation.set(0.38, 0, 0);
                }
            } else if (weapon.kind === 'magic') {
                if (d.armR) { d.armR.rotation.z = -1.4; d.armR.rotation.x = -0.4 - windup * 0.6 + release * 0.4; }
                if (d.handR) d.handR.position.set(0.55, 1.6, 0.65);
                if (d.weaponGroup) {
                    d.weaponGroup.position.set(0.65, 2.15, 0.85);
                    d.weaponGroup.rotation.set(0, windup * Math.PI * 2, -0.2);
                }
            } else { // melee/fist
                const isPunch = weapon.name.includes('拳');
                if (d.armR) {
                    d.armR.rotation.z = -0.8 - swing * 0.5;
                    d.armR.rotation.x = -0.3 + swing * (isPunch ? 1.0 : 1.2);
                }
                if (d.handR) d.handR.position.set(0.65, 1.45, 0.4 + swing * (isPunch ? 0.4 : 0.2));
                if (d.weaponGroup) {
                    d.weaponGroup.position.set(0.65, 1.95, 0.5 + swing * (isPunch ? 0.3 : 0.2));
                    d.weaponGroup.rotation.set(0, 0, -0.4 + swing * 1.2);
                }
                char.rotation.z = state.facingRight ? -0.1 * swing : 0.1 * swing;
            }
            if (d.cape) d.cape.rotation.x = 0.34 + swing * 0.12;
        } else if (state.dodging) {
            // Dodge lean
            char.rotation.z = state.facingRight ? -0.4 : 0.4;
            d.cape.rotation.x = 0.42;
        } else {
            // Idle / walk
            const bob = bounce;
            if (d.head) { d.head.position.y = 2.4 + bob; d.head.rotation.z = 0; }
            if (d.helmet) d.helmet.position.y = 2.45 + bob;
            if (d.crest) d.crest.position.y = 2.75 + bob;
            if (d.body) d.body.position.y = 1.4 + bob * 0.5;
            if (d.chest) d.chest.position.y = 1.65 + bob * 0.45;

            const legSwing = sway;
            if (d.legL) d.legL.rotation.x = legSwing;
            if (d.legR) d.legR.rotation.x = -legSwing;
            if (d.bootL) d.bootL.position.z = 0.08 + Math.max(0, -legSwing) * 0.12;
            if (d.bootR) d.bootR.position.z = 0.08 + Math.max(0, legSwing) * 0.12;

            const armSwing = Math.sin(time * (isMoving ? 10 : 2.5)) * (isMoving ? 0.42 : 0.1);
            if (d.armL) { d.armL.rotation.x = -armSwing; d.armL.rotation.z = 0.12; }
            if (d.armR) { 
                d.armR.rotation.x = armSwing; 
                d.armR.rotation.z = -0.12;
                d.armR.position.z = 0;
            }
            if (d.handR) d.handR.position.set(0.55, 1.3, 0.1);
            if (d.shoulderR) d.shoulderR.rotation.x = 0;
            if (d.weaponGroup) {
                d.weaponGroup.position.set(0.55, 1.3, 0.2);
                d.weaponGroup.rotation.set(0, 0, 0);
            }
            char.rotation.z = 0;
        }

        // Face direction
        char.rotation.y = state.facingRight ? 0 : Math.PI;
    }

    /* ═══════════════════════════════════════════
       SOCKET EVENTS
    ═══════════════════════════════════════════ */
    socket.on('connect', () => { document.getElementById('connStatus').textContent = '🟢 已连接'; });
    socket.on('disconnect', () => { document.getElementById('connStatus').textContent = '🔴 断开连接'; });

    socket.on('waiting', () => {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'flex';
    });

    socket.on('gameStart', (data) => {
        roomId = data.roomId;
        myPlayerNum = data.playerNum;
        gameStarted = true;

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'none';
        document.getElementById('uiOverlay').style.display = 'block';

        if (myPlayerNum === 2) {
            // Swap health/weapon card order in DOM to match right-side start
            const hudTop = document.querySelector('.hud-top');
            if (hudTop) {
                const hContainers = hudTop.querySelectorAll('.health-container');
                if (hContainers.length >= 2) hudTop.appendChild(hContainers[0]);
            }
            
            const wPanel = document.querySelector('.weapon-panel');
            if (wPanel) {
                const wCards = wPanel.querySelectorAll('.weapon-card');
                if (wCards.length >= 2) wPanel.appendChild(wCards[0]);
            }

            const pWCard = document.getElementById('playerWeaponCard');
            const oWCard = document.getElementById('opponentWeaponCard');
            if (pWCard) { pWCard.classList.remove('ally'); pWCard.classList.add('enemy'); }
            if (oWCard) { oWCard.classList.remove('enemy'); oWCard.classList.add('ally'); }
        }

        if (myPlayerNum === 1) {
            localPlayer.x = -5; localPlayer.z = COMBAT_Z; remotePlayer.x = 5; remotePlayer.targetX = 5; remotePlayer.z = COMBAT_Z;
            localPlayer.facingRight = true; remotePlayer.facingRight = false;
        } else {
            localPlayer.x = 5; localPlayer.z = COMBAT_Z; remotePlayer.x = -5; remotePlayer.targetX = -5; remotePlayer.z = COMBAT_Z;
            localPlayer.facingRight = false; remotePlayer.facingRight = true;
        }
        lastSentMove = { x: localPlayer.x, z: COMBAT_Z, facingRight: localPlayer.facingRight };
        lastMoveEmitAt = 0;
        nextWeaponAt = 0;

        document.getElementById('playerInfo').textContent = `我方 (P${myPlayerNum})`;
        document.getElementById('opponentInfo').textContent = `对手: ${data.opponentName}`;

        initCharacters();
        updateWeaponPanel('player');
        updateWeaponPanel('opponent');
        scheduleNextDrop(clock.getElapsedTime());
        animate();
    });

    socket.on('opponentAction', (action) => {
        if (action.type === 'move') {
            remotePlayer.targetX = action.x;
            remotePlayer.z = COMBAT_Z;
            remotePlayer.vx = action.vx;
            remotePlayer.vz = 0;
            remotePlayer.facingRight = action.facingRight;
        } else if (action.type === 'attack') {
            remotePlayer.attacking = true;
            remotePlayer.attackStart = clock.getElapsedTime();
            remotePlayer.facingRight = action.facingRight;
            if (typeof action.weapon === 'number') remotePlayer.weapon = action.weapon;
            if (char2) {
                const weapon = weaponData[remotePlayer.weapon] || weaponData[0];
                if (weapon.kind === 'bow') spawnArrowEffect(char2, action.facingRight, remotePlayer.weapon);
                else spawnSlashEffect(char2, action.facingRight);
            }
            setTimeout(() => { remotePlayer.attacking = false; }, 420);
        } else if (action.type === 'dodge') {
            remotePlayer.dodging = true;
            remotePlayer.vx = action.vx;
            setTimeout(() => { remotePlayer.dodging = false; }, 400);
        } else if (action.type === 'weapon') {
            remotePlayer.weapon = action.weapon;
            if (char2) updateWeaponMesh(char2, action.weapon);
            updateWeaponPanel('opponent', true);
        } else if (action.type === 'dropSpawn') {
            if (action.drop) spawnSkyDrop(action.drop);
        } else if (action.type === 'dropCollect') {
            removeDrop(action.id);
            if (typeof action.health === 'number') {
                const before = remotePlayer.health;
                remotePlayer.health = Math.max(0, Math.min(remotePlayer.maxHealth, action.health));
                updateHealthUI('opponent');
                if (char2) {
                    if (action.dropType === 'meteor') {
                        remotePlayer.hurt = true;
                        spawnHitEffect(char2.position);
                        setTimeout(() => { remotePlayer.hurt = false; }, 300);
                    }
                    const delta = remotePlayer.health - before;
                    if (delta !== 0) {
                        const v = char2.position.clone().project(camera);
                        showDamagePopup(delta, (v.x * 0.5 + 0.5) * window.innerWidth, (-v.y * 0.5 + 0.5) * window.innerHeight);
                    }
                }
                if (remotePlayer.health <= 0) endGame(true);
            }
        } else if (action.type === 'hit') {
            localPlayer.health = Math.max(0, localPlayer.health - action.damage);
            localPlayer.hurt = true;
            updateHealthUI('player');
            if (char1) {
                spawnHitEffect(char1.position);
                cameraShake(0.3);
                // Project 3D pos to screen for popup
                const v = char1.position.clone().project(camera);
                const sx = (v.x * 0.5 + 0.5) * window.innerWidth;
                const sy = (-v.y * 0.5 + 0.5) * window.innerHeight;
                showDamagePopup(-action.damage, sx, sy);
            }
            setTimeout(() => { localPlayer.hurt = false; }, 300);
            if (localPlayer.health <= 0) endGame(false);
        }
    });

    socket.on('opponentLeft', (data) => {
        opponentLeft = true;
        alert(data.message);
        location.reload();
    });

    /* ═══════════════════════════════════════════
       UI FUNCTIONS
    ═══════════════════════════════════════════ */
    function updateHealthUI(who) {
        const p = who === 'player' ? localPlayer : remotePlayer;
        const pct = (p.health / p.maxHealth) * 100;
        document.getElementById(who === 'player' ? 'playerFill' : 'opponentFill').style.width = pct + '%';
        document.getElementById(who === 'player' ? 'playerHpText' : 'opponentHpText').textContent = `${Math.round(p.health)}/${p.maxHealth}`;
    }

    function updateWeaponPanel(who, pulse = false) {
        const isPlayer = who === 'player';
        const prefix = isPlayer ? 'player' : 'opponent';
        const player = isPlayer ? localPlayer : remotePlayer;
        const w = weaponData[player.weapon] || weaponData[0];
        document.getElementById(`${prefix}WIcon`).textContent = w.icon;
        document.getElementById(`${prefix}WName`).textContent = w.name;
        document.getElementById(`${prefix}WDesc`).textContent = w.desc;
        document.getElementById(`${prefix}WPow`).textContent = w.power;
        document.getElementById(`${prefix}WRange`).textContent = w.range.toFixed(1);
        if (pulse) {
            const card = document.getElementById(`${prefix}WeaponCard`);
            card.classList.remove('pulse');
            void card.offsetWidth;
            card.classList.add('pulse');
        }
    }

    function showWeaponToast() {
        updateWeaponPanel('player', true);
    }

    /* ═══════════════════════════════════════════
       INPUT
    ═══════════════════════════════════════════ */
    const keys = { left: false, right: false, up: false, down: false };
    const joystickState = { active: false, x: 0, y: 0 };

    document.addEventListener('keydown', (e) => {
        if (!gameStarted) return;
        switch(e.key) {
            case 'ArrowLeft': case 'a': case 'A': keys.left = true; break;
            case 'ArrowRight': case 'd': case 'D': keys.right = true; break;
            case 'ArrowUp': case 'w': case 'W': keys.up = true; break;
            case 'ArrowDown': case 's': case 'S': keys.down = true; break;
            case ' ': case 'j': case 'J': e.preventDefault(); doAttack(); break;
            case 'Shift': case 'k': case 'K': e.preventDefault(); doDodge(); break;
            case 'e': case 'E': e.preventDefault(); doWeaponSwitch(); break;
        }
    });
    document.addEventListener('keyup', (e) => {
        switch(e.key) {
            case 'ArrowLeft': case 'a': case 'A': keys.left = false; break;
            case 'ArrowRight': case 'd': case 'D': keys.right = false; break;
            case 'ArrowUp': case 'w': case 'W': keys.up = false; break;
            case 'ArrowDown': case 's': case 'S': keys.down = false; break;
        }
    });

    // Joystick
    const joyZone = document.getElementById('joystickZone');
    const joyBase = joyZone.querySelector('.joy-base');
    const joyKnob = document.getElementById('joyKnob');
    let joyCenter = { x: 0, y: 0 };
    let joyTouchId = null;
    const joyMax = 64;

    joyZone.addEventListener('touchstart', (e) => { e.preventDefault();
        if (joystickState.active) return;
        const touch = e.changedTouches[0];
        const zoneRect = joyZone.getBoundingClientRect();
        joystickState.active = true;
        joyTouchId = touch.identifier;
        joyCenter = { x: touch.clientX, y: touch.clientY };
        joyBase.style.left = `${touch.clientX - zoneRect.left - 80}px`;
        joyBase.style.top = `${touch.clientY - zoneRect.top - 80}px`;
        joyBase.style.bottom = 'auto';
        joyZone.classList.add('active');
        handleJoy(e);
    });
    joyZone.addEventListener('touchmove', (e) => { e.preventDefault(); handleJoy(e); });
    joyZone.addEventListener('touchend', (e) => { e.preventDefault(); endJoy(e); });
    joyZone.addEventListener('touchcancel', (e) => { e.preventDefault(); endJoy(e); });

    function handleJoy(e) {
        if (!joystickState.active) return;
        const touch = Array.from(e.touches).find(t => t.identifier === joyTouchId);
        if (!touch) return;
        let dx = touch.clientX - joyCenter.x;
        let dy = touch.clientY - joyCenter.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > joyMax) { dx = dx/dist*joyMax; dy = dy/dist*joyMax; }
        joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        joystickState.x = dx / joyMax;
        joystickState.y = dy / joyMax;
    }

    function endJoy(e) {
        const ended = Array.from(e.changedTouches).some(t => t.identifier === joyTouchId);
        if (!ended) return;
        joystickState.active = false;
        joystickState.x = 0;
        joystickState.y = 0;
        joyTouchId = null;
        joyZone.classList.remove('active');
        joyKnob.style.transform = 'translate(-50%,-50%)';
    }

    // Touch buttons
    document.getElementById('attackBtn').addEventListener('touchstart', (e) => { e.preventDefault(); doAttack(); });
    document.getElementById('dodgeBtn').addEventListener('touchstart', (e) => { e.preventDefault(); doDodge(); });
    document.getElementById('weaponBtn').addEventListener('touchstart', (e) => { e.preventDefault(); doWeaponSwitch(); });

    /* ═══════════════════════════════════════════
       GAME ACTIONS
    ═══════════════════════════════════════════ */
    let nextWeaponAt = 0;
    const weaponCooldownSeconds = 5;

    function getRandomWeaponIndex() {
        if (weaponData.length <= 1) return 0;
        let next = localPlayer.weapon;
        while (next === localPlayer.weapon) next = Math.floor(Math.random() * weaponData.length);
        return next;
    }

    function updateWeaponCooldownUI(time) {
        const btn = document.getElementById('weaponBtn');
        const label = document.getElementById('weaponCooldown');
        const overlay = document.getElementById('weaponCdOverlay');
        const remaining = Math.max(0, nextWeaponAt - time);
        const ratio = remaining / weaponCooldownSeconds;
        
        btn.classList.toggle('cooldown', remaining > 0);
        label.textContent = `${Math.ceil(remaining)}s`;
        if (remaining > 0) {
            overlay.style.background = `conic-gradient(rgba(0,0,0,0.6) ${ratio * 360}deg, transparent 0deg)`;
        } else {
            overlay.style.background = 'none';
        }
    }

    function doAttack() {
        if (!localPlayer.attacking && gameStarted && !opponentLeft) {
            const weapon = weaponData[localPlayer.weapon];
            localPlayer.attacking = true;
            localPlayer.attackStart = clock.getElapsedTime();
            socket.emit('gameAction', { roomId, action: { type: 'attack', facingRight: localPlayer.facingRight, weapon: localPlayer.weapon } });
            if (char1) {
                if (weapon.kind === 'bow') spawnArrowEffect(char1, localPlayer.facingRight, localPlayer.weapon);
                else spawnSlashEffect(char1, localPlayer.facingRight);
            }
            const dist = Math.abs(localPlayer.x - remotePlayer.x);
            if (dist < weapon.range) {
                const dmg = weapon.power;
                socket.emit('gameAction', { roomId, action: { type: 'hit', damage: dmg } });
                if (char2) { spawnHitEffect(char2.position); cameraShake(0.15); }
                remotePlayer.health = Math.max(0, remotePlayer.health - dmg);
                remotePlayer.hurt = true;
                updateHealthUI('opponent');
                setTimeout(() => { remotePlayer.hurt = false; }, 300);
                if (remotePlayer.health <= 0) endGame(true);
            }
            setTimeout(() => { localPlayer.attacking = false; }, 420);
        }
    }

    function doDodge() {
        if (!localPlayer.dodging && gameStarted && !opponentLeft) {
            localPlayer.dodging = true;
            localPlayer.vx = localPlayer.facingRight ? -3 : 3;
            socket.emit('gameAction', { roomId, action: { type: 'dodge', vx: localPlayer.vx } });
            setTimeout(() => { localPlayer.dodging = false; }, 400);
        }
    }

    function doWeaponSwitch() {
        if (gameStarted && !opponentLeft) {
            const time = clock.getElapsedTime();
            if (time < nextWeaponAt) return;
            localPlayer.weapon = getRandomWeaponIndex();
            nextWeaponAt = time + weaponCooldownSeconds;
            socket.emit('gameAction', { roomId, action: { type: 'weapon', weapon: localPlayer.weapon } });
            if (char1) updateWeaponMesh(char1, localPlayer.weapon);
            showWeaponToast();
            updateWeaponCooldownUI(time);
        }
    }

    /* ═══════════════════════════════════════════
       GAME LOOP
    ═══════════════════════════════════════════ */
    const clock = new THREE.Clock();
    let lastMoveEmitAt = 0;
    let lastSentMove = { x: 0, z: 0, facingRight: true };

    function updateLocalPlayer(time) {
        if (!gameStarted || opponentLeft) return;
        if (keys.left) { localPlayer.vx = -0.12; localPlayer.facingRight = false; }
        else if (keys.right) { localPlayer.vx = 0.12; localPlayer.facingRight = true; }
        if (keys.up || keys.down) localPlayer.vz = 0;
        if (joystickState.active) {
            localPlayer.vx = joystickState.x * 0.12;
            localPlayer.vz = 0;
            if (joystickState.x > 0.2) localPlayer.facingRight = true;
            if (joystickState.x < -0.2) localPlayer.facingRight = false;
        }
        if (!keys.left && !keys.right && !joystickState.active) localPlayer.vx *= 0.85;
        localPlayer.vz = 0;

        localPlayer.x += localPlayer.vx;
        localPlayer.z = COMBAT_Z;
        localPlayer.vx *= 0.92;
        localPlayer.vz = 0;
        localPlayer.x = Math.max(-13, Math.min(13, localPlayer.x));
        localPlayer.z = COMBAT_Z;

        const moved = Math.abs(localPlayer.x - lastSentMove.x) > 0.05;
        const turned = localPlayer.facingRight !== lastSentMove.facingRight;
        if (time - lastMoveEmitAt > 0.066 && (moved || turned || Math.abs(localPlayer.vx) > 0.01)) {
            socket.emit('gameAction', { roomId, action: { type: 'move', x: localPlayer.x, z: COMBAT_Z, vx: localPlayer.vx, vz: 0, facingRight: localPlayer.facingRight } });
            lastMoveEmitAt = time;
            lastSentMove = { x: localPlayer.x, z: COMBAT_Z, facingRight: localPlayer.facingRight };
        }
    }

    function updateCamera(dt) {
        const midX = (localPlayer.x + remotePlayer.x) * 0.5;
        const spread = Math.min(13, Math.abs(localPlayer.x - remotePlayer.x));
        cameraTarget.set(midX, 1.55, COMBAT_Z);
        cameraDesired.set(midX, 8.4 + spread * 0.22, 12.2 + spread * 0.58);
        camera.position.lerp(cameraDesired, Math.min(1, dt * 3.5));
        if (shakeTimer > 0) {
            shakeTimer = Math.max(0, shakeTimer - dt);
            const falloff = shakeTimer / 0.28;
            camera.position.x += (Math.random() - 0.5) * shakePower * falloff;
            camera.position.y += (Math.random() - 0.5) * shakePower * 0.45 * falloff;
            shakePower *= 0.92;
        }
        camera.lookAt(cameraTarget);
    }

    function animate() {
        if (!gameStarted) return;
        requestAnimationFrame(animate);

        const dt = clock.getDelta();
        const time = clock.getElapsedTime();

        updateLocalPlayer(time);

        // Sync 3D positions
        if (char1) {
            char1.position.x = localPlayer.x;
            char1.position.y = 0;
            char1.position.z = COMBAT_Z;
            animateCharacter(char1, localPlayer, time);
        }
        if (char2) {
            // Lerp remote player position for smoothness
            remotePlayer.x += (remotePlayer.targetX - remotePlayer.x) * Math.min(1, dt * 15);
            char2.position.x = remotePlayer.x;
            char2.position.y = 0;
            char2.position.z = COMBAT_Z;
            animateCharacter(char2, remotePlayer, time);
        }

        if (grassMat.userData.shader) {
            grassMat.userData.shader.uniforms.uTime.value = time;
        }

        // Animate particles
        const pAttr = particles.geometry.attributes.position;
        for (let i = 0; i < partCount; i++) {
            pAttr.array[i*3+1] += Math.sin(time + i) * 0.003;
        }
        pAttr.needsUpdate = true;
        clouds.forEach((cloud, i) => {
            cloud.position.x += dt * (0.15 + i * 0.05); // Continuous drift
            cloud.position.y += Math.sin(time * 0.2 + i) * 0.002;
            if (cloud.position.x > 35) cloud.position.x = -35;
        });

        updateEffects(dt);
        updateDrops(dt, time);
        updateWeaponCooldownUI(time);
        updateCamera(dt);
        renderer.render(scene, camera);
    }

    function endGame(iWon) {
        gameStarted = false;
        const screen = document.getElementById('gameOverScreen');
        const text = document.getElementById('gameOverText');
        text.textContent = iWon ? '🎉 胜利！' : '😢 失败了！';
        text.style.color = iWon ? '#51cf66' : '#ff6b6b';
        screen.classList.add('show');
    }

    // Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    </script>
</body>
</html>
