<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>小战士大冒险 - 3D 双人对战 ⚔️</title>
    <meta name="description" content="小战士大冒险 - 在线3D双人对战游戏">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/lib/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-a: #f7971e; --gold-b: #ffd200;
            --green: #51cf66; --red: #ff6b6b;
            --ink: #14142b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; font-family: 'Outfit', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0a0a1a; touch-action: none; color: #fff; }
        #gameContainer { width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; }
        button { font-family: inherit; }

        /* ── Glassmorphism Panel ── */
        .glass {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
        }

        /* ══════════════ LOGIN ══════════════ */
        #loginScreen {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
        }
        /* Animated aurora blobs */
        .aurora { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; pointer-events: none; }
        .aurora.a1 { width: 55vmax; height: 55vmax; left: -18vmax; top: -20vmax;
            background: radial-gradient(circle, #6a5cff55, transparent 65%); animation: drift1 16s ease-in-out infinite alternate; }
        .aurora.a2 { width: 48vmax; height: 48vmax; right: -16vmax; bottom: -18vmax;
            background: radial-gradient(circle, #f7971e44, transparent 65%); animation: drift2 19s ease-in-out infinite alternate; }
        .aurora.a3 { width: 34vmax; height: 34vmax; right: 8vmax; top: -12vmax;
            background: radial-gradient(circle, #27c4f544, transparent 65%); animation: drift1 23s ease-in-out infinite alternate-reverse; }
        @keyframes drift1 { to { transform: translate(9vmax, 7vmax) scale(1.15); } }
        @keyframes drift2 { to { transform: translate(-8vmax, -6vmax) scale(1.1); } }
        /* Floating embers */
        .ember { position: absolute; bottom: -24px; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle, #ffd200cc, #f7971e33 70%, transparent);
            animation: emberFloat linear infinite; opacity: 0; }
        @keyframes emberFloat {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            8% { opacity: 0.9; }
            100% { transform: translateY(-108vh) translateX(4vw) scale(0.4); opacity: 0; }
        }
        #loginScreen .title-wrap { position: relative; text-align: center; animation: titleIn 0.7s cubic-bezier(0.22, 1.4, 0.36, 1) both; }
        #loginScreen h1 {
            font-size: clamp(34px, 6vw, 54px); font-weight: 900; margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold-a), var(--gold-b) 45%, #fff2b0 55%, var(--gold-b));
            background-size: 220% 100%;
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            line-height: 1.3; animation: shine 3.2s linear infinite;
            filter: drop-shadow(0 6px 24px rgba(247,151,30,0.35));
        }
        @keyframes shine { to { background-position: 220% 0; } }
        @keyframes titleIn { from { transform: translateY(-26px) scale(0.92); opacity: 0; } }
        .title-sword { display: inline-block; animation: swordClash 2.4s ease-in-out infinite; transform-origin: 70% 70%; }
        @keyframes swordClash {
            0%, 100% { transform: rotate(0); } 8% { transform: rotate(-16deg) translateY(-3px); }
            16% { transform: rotate(6deg); } 24% { transform: rotate(0); }
        }
        #loginScreen .subtitle {
            font-size: 15px; color: rgba(255,255,255,0.55); margin-bottom: 34px;
            letter-spacing: 6px; text-transform: uppercase;
        }
        .login-card {
            padding: 34px 36px 28px; width: min(380px, calc(100vw - 48px)); text-align: center;
            animation: cardIn 0.7s 0.12s cubic-bezier(0.22, 1.3, 0.36, 1) both;
            box-shadow: 0 24px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.16);
        }
        @keyframes cardIn { from { transform: translateY(22px); opacity: 0; } }
        .login-card input {
            width: 100%; padding: 15px 22px; font-size: 17px;
            border-radius: 12px; background: rgba(255,255,255,0.09); color: #fff;
            outline: none; text-align: center; margin-bottom: 16px; font-family: inherit;
            border: 1px solid rgba(255,255,255,0.12); transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }
        .login-card input:focus { border-color: rgba(247,151,30,0.7); box-shadow: 0 0 0 4px rgba(247,151,30,0.15); background: rgba(255,255,255,0.13); }
        .login-card input::placeholder { color: rgba(255,255,255,0.32); }
        .btn-primary {
            position: relative; width: 100%; padding: 15px; font-size: 19px; font-weight: 800;
            border: none; border-radius: 12px; cursor: pointer; overflow: hidden;
            background: linear-gradient(135deg, var(--gold-a), var(--gold-b));
            color: var(--ink); box-shadow: 0 6px 28px rgba(247,151,30,0.42);
            transition: transform 0.18s, box-shadow 0.18s, filter 0.18s;
        }
        .btn-primary::after {
            content: ''; position: absolute; top: 0; left: -80%; width: 55%; height: 100%;
            background: linear-gradient(105deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-22deg); transition: left 0.55s ease;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 36px rgba(247,151,30,0.55); }
        .btn-primary:hover::after { left: 130%; }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled { filter: grayscale(0.5) brightness(0.8); cursor: wait; transform: none; }
        .btn-ghost {
            width: 100%; margin-top: 10px; padding: 12px; font-size: 15px; font-weight: 700;
            border-radius: 12px; cursor: pointer; color: rgba(255,255,255,0.82);
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16);
            transition: background 0.2s, transform 0.18s;
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.13); transform: translateY(-1px); }
        #status { color: rgba(255,255,255,0.6); margin-top: 14px; font-size: 13px; min-height: 18px; }
        #status.error { color: #ff8787; }
        .ctrl-hints { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
        .ctrl-chip {
            display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.62);
            padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ctrl-chip b {
            min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; display: inline-flex;
            align-items: center; justify-content: center; font-size: 11px; color: var(--ink);
            background: linear-gradient(135deg, #ffe9a8, var(--gold-b)); box-shadow: 0 2px 0 #b8860b;
        }
        .login-foot { position: absolute; bottom: 18px; font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }

        /* ══════════════ WAITING ══════════════ */
        #waitingScreen {
            position: fixed; inset: 0; display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }
        .radar { position: relative; width: 150px; height: 150px; margin-bottom: 34px; }
        .radar .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,210,0,0.65); animation: radarPulse 2s ease-out infinite; }
        .radar .ring:nth-child(2) { animation-delay: 0.66s; }
        .radar .ring:nth-child(3) { animation-delay: 1.32s; }
        .radar .core {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 46px; animation: coreBob 1.6s ease-in-out infinite;
        }
        @keyframes radarPulse { from { transform: scale(0.35); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
        @keyframes coreBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        #waitingScreen h2 { font-size: 26px; font-weight: 800; color: rgba(255,255,255,0.92); }
        .wait-dots::after { content: ''; animation: dots 1.4s steps(4) infinite; }
        @keyframes dots { 0% { content: ''; } 25% { content: '·'; } 50% { content: '··'; } 75% { content: '···'; } }
        .wait-tip { color: rgba(255,255,255,0.42); font-size: 14px; margin-top: 10px; }
        .btn-cancel {
            margin-top: 30px; padding: 11px 30px; font-size: 14px; font-weight: 700; border-radius: 999px;
            color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.07); cursor: pointer;
            border: 1px solid rgba(255,255,255,0.16); transition: background 0.2s, transform 0.18s;
        }
        .btn-cancel:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }

        /* ══════════════ HUD ══════════════ */
        .ui-overlay { position: fixed; inset: 0; pointer-events: none; display: none; }

        /* Health Bars */
        .hud-top { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
        .health-container { flex: 1; max-width: 340px; }
        .health-container.enemy { text-align: right; }
        .health-name { font-size: 13px; font-weight: 900; margin-bottom: 6px; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 6px; }
        .health-container.enemy .health-name { justify-content: flex-end; }
        .health-name.enemy { color: #ff8787; }
        .health-name.ally { color: #8ce99a; }
        .health-bar-wrap {
            height: 22px; border-radius: 999px; overflow: hidden; position: relative;
            background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 2px 6px rgba(0,0,0,0.4);
        }
        .health-bar-ghost {
            position: absolute; inset: 0; width: 100%; border-radius: 999px;
            background: rgba(255,255,255,0.55); transition: width 0.9s 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .health-bar-fill {
            position: absolute; inset: 0; width: 100%; border-radius: 999px;
            transition: width 0.18s ease-out;
        }
        .health-bar-fill.ally { background: linear-gradient(90deg, #37b24d, #94d82d); }
        .health-bar-fill.enemy { background: linear-gradient(270deg, #fa5252, #f06595); }
        .health-bar-fill::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.32) 0%, transparent 55%);
            border-radius: 999px;
        }
        .health-bar-wrap.low .health-bar-fill { animation: lowHpPulse 0.85s ease-in-out infinite; }
        @keyframes lowHpPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.55); } }
        .health-text {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 11px; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,0.7); z-index: 2;
        }
        .health-container:not(.enemy) .health-text { left: 12px; }
        .health-container.enemy .health-text { right: 12px; }
        #matchTimer {
            align-self: flex-start; padding: 7px 16px; border-radius: 999px; font-size: 14px; font-weight: 800;
            letter-spacing: 1px; color: rgba(255,255,255,0.9);
            background: rgba(0,0,0,0.38); border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 4px 14px rgba(0,0,0,0.3); font-variant-numeric: tabular-nums;
        }

        /* Weapon Info */
        .weapon-panel {
            position: absolute; top: 64px; left: 14px; right: 14px;
            display: flex; justify-content: space-between; gap: 12px; pointer-events: none;
        }
        .weapon-card {
            min-width: 190px; max-width: 250px; padding: 10px 13px;
            display: grid; grid-template-columns: 46px minmax(0, 1fr);
            align-items: center; gap: 11px; position: relative;
            background: rgba(10,10,26,0.42);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.13); border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.14);
            transition: border-color 0.3s;
        }
        .weapon-card.enemy { grid-template-columns: minmax(0, 1fr) 46px; text-align: right; }
        .weapon-card.enemy .weapon-emoji { order: 2; }
        .weapon-card.enemy .weapon-detail { order: 1; }
        .weapon-card.enemy .weapon-stats { justify-content: flex-end; }
        .weapon-card.pulse { animation: weaponPulse 0.45s cubic-bezier(0.22, 1.4, 0.36, 1); border-color: rgba(255,210,0,0.55); }
        .weapon-emoji {
            width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; border-radius: 12px; background: rgba(255,255,255,0.09);
            box-shadow: inset 0 0 18px rgba(255,255,255,0.08), 0 6px 16px rgba(0,0,0,0.25);
        }
        .weapon-detail { position: relative; z-index: 1; min-width: 0; }
        .weapon-detail .w-label { font-size: 10px; letter-spacing: 2px; font-weight: 900; color: rgba(255,255,255,0.48); }
        .weapon-detail .w-name { font-size: 17px; line-height: 1.1; font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .weapon-detail .w-desc { margin-top: 3px; font-size: 11px; color: rgba(255,255,255,0.6); }
        .weapon-stats { display: flex; gap: 6px; margin-top: 7px; }
        .weapon-stat {
            padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 800;
            background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.12);
        }
        .weapon-stat.power { color: #ffd166; }
        .weapon-stat.range { color: #90caf9; }
        @keyframes weaponPulse { 0% { transform: scale(1); } 45% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @media (max-width: 680px) {
            .weapon-panel { top: 74px; }
            .weapon-card { min-width: 0; flex: 1; padding: 8px 10px; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; }
            .weapon-card.enemy { grid-template-columns: minmax(0, 1fr) 38px; }
            .weapon-emoji { width: 38px; height: 38px; font-size: 23px; }
            .weapon-detail .w-name { font-size: 14px; }
            .weapon-detail .w-desc { display: none; }
            .weapon-stats { margin-top: 4px; }
            .weapon-stat { font-size: 10px; padding: 2px 6px; }
        }

        /* Joystick */
        .joystick-zone {
            position: absolute; bottom: 0; left: 0; width: min(46vw, 360px); height: min(58vh, 430px);
            pointer-events: auto;
        }
        .joy-base {
            position: absolute; width: 148px; height: 148px; border-radius: 50%; left: 34px; bottom: 34px;
            opacity: 0.5; transition: opacity 0.15s ease;
            background: radial-gradient(circle, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
            border: 2px solid rgba(255,255,255,0.18);
            box-shadow: inset 0 0 30px rgba(255,255,255,0.05);
        }
        .joystick-zone.active .joy-base { opacity: 1; border-color: rgba(255,210,0,0.5); }
        .joy-knob {
            position: absolute; width: 56px; height: 56px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0.12) 70%);
            border: 2px solid rgba(255,255,255,0.35);
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        /* Action Buttons */
        .action-zone { position: absolute; bottom: 28px; right: 26px; pointer-events: auto; }
        .act-btn {
            width: 64px; height: 64px; border-radius: 50%; display: flex; position: relative;
            align-items: center; justify-content: center; font-size: 26px;
            margin: 8px; cursor: pointer; user-select: none; -webkit-user-select: none;
            transition: transform 0.12s, background 0.15s, box-shadow 0.15s, border-color 0.15s;
            background: rgba(12,12,30,0.5); border: 2px solid rgba(255,255,255,0.18);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.14);
        }
        .act-btn:hover { border-color: rgba(255,210,0,0.45); }
        .act-btn.pressed, .act-btn:active { transform: scale(0.86); background: rgba(255,210,0,0.22); box-shadow: 0 0 26px rgba(255,210,0,0.35); }
        .act-btn.cooldown { filter: grayscale(0.6); border-color: rgba(255,255,255,0.07); }
        .act-btn .cooldown-overlay {
            position: absolute; inset: -2px; border-radius: 50%; pointer-events: none; z-index: 1;
            display: none;
        }
        .act-btn.cooldown .cooldown-overlay { display: block; }
        .act-btn .cooldown-label {
            position: absolute; inset: auto auto -7px 50%; transform: translateX(-50%);
            min-width: 34px; height: 18px; border-radius: 999px; display: none;
            align-items: center; justify-content: center; font-size: 11px; font-weight: 900;
            color: var(--ink); background: rgba(255,255,255,0.92); z-index: 5;
        }
        .act-btn.cooldown .cooldown-label { display: flex; }
        .key-hint {
            position: absolute; left: -4px; top: -4px; min-width: 22px; height: 22px;
            padding: 0 5px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 900; color: var(--ink);
            background: linear-gradient(135deg, #ffe9a8, var(--gold-b)); box-shadow: 0 2px 0 #b8860b, 0 4px 10px rgba(0,0,0,0.35);
            z-index: 20;
        }
        @media (max-width: 800px) { .key-hint { display: none !important; } }
        .btn-row { display: flex; justify-content: center; gap: 8px; }

        /* Connection + sound */
        .hud-corner { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
        .conn-status {
            padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
            color: rgba(255,255,255,0.65); background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.1); transition: color 0.3s;
        }
        .conn-status.ok { color: #8ce99a; }
        .conn-status.bad { color: #ff8787; }
        #soundToggle {
            pointer-events: auto; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 15px;
            background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.14); color: #fff;
            transition: background 0.2s, transform 0.15s;
        }
        #soundToggle:hover { background: rgba(255,255,255,0.14); transform: scale(1.08); }

        /* ══════════════ COUNTDOWN / TOAST / POPUPS ══════════════ */
        #countdownOverlay {
            position: fixed; inset: 0; z-index: 900; display: none;
            align-items: center; justify-content: center; pointer-events: none;
        }
        #countdownText {
            font-size: clamp(72px, 16vw, 150px); font-weight: 900;
            background: linear-gradient(135deg, var(--gold-a), var(--gold-b));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 40px rgba(247,151,30,0.5));
        }
        #countdownText.pop { animation: countPop 0.72s cubic-bezier(0.22, 1.5, 0.36, 1) both; }
        @keyframes countPop {
            0% { transform: scale(2.4); opacity: 0; } 35% { transform: scale(1); opacity: 1; }
            80% { transform: scale(0.94); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; }
        }
        .toast-wrap { position: fixed; top: 17%; left: 50%; transform: translateX(-50%); z-index: 950; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
        .toast {
            padding: 11px 26px; border-radius: 999px; font-size: 16px; font-weight: 800;
            background: rgba(10,10,28,0.72); border: 1px solid rgba(255,210,0,0.4); color: #ffe9a8;
            box-shadow: 0 12px 40px rgba(0,0,0,0.45); backdrop-filter: blur(12px);
            animation: toastIn 2.2s cubic-bezier(0.22, 1.3, 0.36, 1) both;
        }
        @keyframes toastIn {
            0% { transform: translateY(-18px) scale(0.85); opacity: 0; }
            12%, 82% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-12px); opacity: 0; }
        }
        .dmg-popup {
            position: fixed; pointer-events: none; font-size: 30px; font-weight: 900;
            color: var(--red); text-shadow: 0 0 14px rgba(255,60,60,0.65), 0 2px 4px rgba(0,0,0,0.6);
            animation: dmgFloat 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards; z-index: 500;
        }
        .dmg-popup.crit { font-size: 40px; color: #ffd43b; text-shadow: 0 0 20px rgba(255,180,0,0.8), 0 2px 4px rgba(0,0,0,0.6); }
        .dmg-popup.heal { color: #69db7c; text-shadow: 0 0 14px rgba(60,255,120,0.55), 0 2px 4px rgba(0,0,0,0.6); }
        @keyframes dmgFloat {
            0% { opacity: 0; transform: translateY(8px) scale(0.5); }
            18% { opacity: 1; transform: translateY(-6px) scale(1.25); }

    <script>
    'use strict';
    console.log('Game Script Loading...');

    /* ═══════════════════════════════════════════
       AUDIO MANAGER — WebAudio 合成音效 & 程序化 BGM
       （无外部音频依赖，自动播放受限时静默降级）
    ═══════════════════════════════════════════ */
    const audio = {
        ctx: null, master: null, bgmGain: null,
        muted: localStorage.getItem('littleWarrior.muted') === '1',
        bgmTimer: null, bgmStep: 0,

        ensure() {
            if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return true; }
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
                this.master = this.ctx.createGain();
                this.master.gain.value = this.muted ? 0 : 1;
                this.master.connect(this.ctx.destination);
                this.bgmGain = this.ctx.createGain();
                this.bgmGain.gain.value = 0.16;
                this.bgmGain.connect(this.master);
                return true;
            } catch (e) { return false; }
        },

        toggleMute() {
            this.muted = !this.muted;
            localStorage.setItem('littleWarrior.muted', this.muted ? '1' : '0');
            if (this.master) this.master.gain.linearRampToValueAtTime(this.muted ? 0 : 1, this.ctx.currentTime + 0.1);
            return this.muted;
        },

        tone({ freq = 440, freqEnd = null, type = 'sine', dur = 0.15, vol = 0.5, delay = 0, curve = 'exp' }) {
            if (!this.ensure()) return;
            const t0 = this.ctx.currentTime + delay;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
            if (curve === 'exp') g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            else g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(g); g.connect(this.master);
            osc.start(t0); osc.stop(t0 + dur + 0.05);
        },

        noise({ dur = 0.2, vol = 0.4, delay = 0, from = 3000, to = 400, q = 1.2 }) {
            if (!this.ensure()) return;
            const t0 = this.ctx.currentTime + delay;
            const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
            const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
            const src = this.ctx.createBufferSource(); src.buffer = buf;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass'; filter.Q.value = q;
            filter.frequency.setValueAtTime(from, t0);
            filter.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
            const g = this.ctx.createGain();
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.linearRampToValueAtTime(vol, t0 + 0.015);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            src.connect(filter); filter.connect(g); g.connect(this.master);
            src.start(t0);
        },

        play(name) {
            if (this.muted) return;
            switch (name) {
                case 'attack': this.noise({ dur: 0.16, vol: 0.32, from: 2600, to: 500, q: 1.6 }); break;
                case 'hit':
                    this.noise({ dur: 0.12, vol: 0.42, from: 900, to: 180, q: 1.0 });
                    this.tone({ freq: 210, freqEnd: 70, type: 'square', dur: 0.14, vol: 0.26 });
                    break;
                case 'dodge': this.noise({ dur: 0.2, vol: 0.2, from: 700, to: 3400, q: 1.4 }); break;
                case 'switch':
                    this.tone({ freq: 660, type: 'triangle', dur: 0.09, vol: 0.3 });
                    this.tone({ freq: 990, type: 'triangle', dur: 0.14, vol: 0.3, delay: 0.08 });
                    break;
                case 'drop':
                    [523, 659, 784].forEach((f, i) => this.tone({ freq: f, type: 'triangle', dur: 0.11, vol: 0.26, delay: i * 0.07 }));
                    break;
                case 'hurt': this.tone({ freq: 160, freqEnd: 90, type: 'sawtooth', dur: 0.18, vol: 0.22 }); break;
                case 'count': this.tone({ freq: 440, type: 'sine', dur: 0.12, vol: 0.32 }); break;
                case 'fight': this.tone({ freq: 880, type: 'sine', dur: 0.3, vol: 0.38 }); break;
                case 'win':
                    [523, 659, 784, 1047].forEach((f, i) => this.tone({ freq: f, type: 'triangle', dur: 0.28, vol: 0.3, delay: i * 0.12 }));
                    break;
                case 'lose':
                    [392, 330, 262].forEach((f, i) => this.tone({ freq: f, type: 'sine', dur: 0.34, vol: 0.26, delay: i * 0.16 }));
                    break;
            }
        },

        startBgm() {
            if (!this.ensure() || this.bgmTimer) return;
            // 欢快的五声音阶琶音 + 低音，112 BPM
            const melody = [523, 587, 659, 784, 880, 784, 659, 587, 523, 659, 784, 880, 1047, 880, 784, 659];
            const bass = [131, 131, 175, 196];
            const stepDur = 60 / 112 / 2;
            let nextTime = this.ctx.currentTime + 0.1;
            this.bgmStep = 0;
            const schedule = () => {
                if (!this.ctx) return;
                while (nextTime < this.ctx.currentTime + 0.35) {
                    const s = this.bgmStep;
                    const mFreq = melody[s % melody.length];
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.value = mFreq;
                    g.gain.setValueAtTime(0.0001, nextTime);
                    g.gain.linearRampToValueAtTime(0.5, nextTime + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, nextTime + stepDur * 0.95);
                    osc.connect(g); g.connect(this.bgmGain);
                    osc.start(nextTime); osc.stop(nextTime + stepDur);
                    if (s % 4 === 0) {
                        const bOsc = this.ctx.createOscillator();
                        const bG = this.ctx.createGain();
                        bOsc.type = 'sine'; bOsc.frequency.value = bass[(s / 4) % bass.length | 0];
                        bG.gain.setValueAtTime(0.0001, nextTime);
                        bG.gain.linearRampToValueAtTime(0.55, nextTime + 0.03);
                        bG.gain.exponentialRampToValueAtTime(0.0001, nextTime + stepDur * 3.6);
                        bOsc.connect(bG); bG.connect(this.bgmGain);
                        bOsc.start(nextTime); bOsc.stop(nextTime + stepDur * 4);
                    }
                    nextTime += stepDur;
                    this.bgmStep++;
                }
            };
            schedule();
            this.bgmTimer = setInterval(schedule, 120);
        }
    };

    // 首次交互解锁音频
    ['pointerdown', 'keydown'].forEach(ev =>
        window.addEventListener(ev, () => audio.ensure(), { once: true, passive: true }));
    document.addEventListener('visibilitychange', () => {
        if (!audio.ctx) return;
        if (document.hidden) audio.ctx.suspend();
        else if (!audio.muted) audio.ctx.resume();
    });

    // 登录页浮动火星
    (function spawnEmbers() {
        const box = document.getElementById('embers');
        for (let i = 0; i < 16; i++) {
            const e = document.createElement('div');
            e.className = 'ember';
            const size = 3 + Math.random() * 6;
            e.style.width = e.style.height = size + 'px';
            e.style.left = Math.random() * 100 + 'vw';
            e.style.animationDuration = (7 + Math.random() * 9) + 's';
            e.style.animationDelay = (Math.random() * 10) + 's';
            box.appendChild(e);
        }
    })();

    /* ═══════════════════════════════════════════
       LOGIN FLOW
    ═══════════════════════════════════════════ */
    const playerNameInput = document.getElementById('playerName');
    const joinBtn = document.getElementById('joinBtn');
    const statusEl = document.getElementById('status');
    const savedPlayerName = localStorage.getItem('littleWarrior.playerName');
    if (savedPlayerName) playerNameInput.value = savedPlayerName;

    function setStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.classList.toggle('error', isError);
    }

    joinBtn.addEventListener('click', () => {
        if (joinBtn.disabled) return;
        const name = playerNameInput.value.trim() || '匿名玩家';
        localStorage.setItem('littleWarrior.playerName', name);
        joinBtn.disabled = true;
        setStatus('正在连接服务器...');
        if (!socket.connected) {
            setStatus('连接失败，请检查网络后刷新重试', true);
            joinBtn.disabled = false;
            return;
        }
        audio.ensure(); audio.startBgm();
        socket.emit('joinGame', name);
        setStatus('匹配中...');
        setTimeout(() => { joinBtn.disabled = false; }, 2500);
    });
    playerNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); joinBtn.click(); }
    });
    document.getElementById('practiceBtn').addEventListener('click', () => {
        audio.ensure(); audio.startBgm();
        startPracticeMode();
    });
    document.getElementById('cancelMatchBtn').addEventListener('click', () => location.reload());

    /* ═══════════════════════════════════════════
       NETWORK
    ═══════════════════════════════════════════ */
    const socket = io();
    let myPlayerNum = 0, roomId = null, gameStarted = false, opponentLeft = false;
    let practiceMode = false, matchOver = false, canAct = false;
    let matchStartTime = 0;
    const COMBAT_Z = 0;
    const ARENA_MIN = -13, ARENA_MAX = 13;

    const localPlayer = { x: 0, z: 0, health: 100, maxHealth: 100, weapon: 0,
        attacking: false, attackStart: -1, dodging: false, hurt: false, facingRight: true, vx: 0, vz: 0 };
    const remotePlayer = { x: 0, targetX: 0, z: 0, health: 100, maxHealth: 100, weapon: 0,
        attacking: false, attackStart: -1, dodging: false, hurt: false, facingRight: false, vx: 0, vz: 0 };

    const weaponData = [
        { name: '勇气拳套', power: 10, range: 2.5, icon: '👊', color: 0xffffff, accent: 0xffd166, desc: '贴身爆发连击', kind: 'melee' },
        { name: '星光大剑', power: 15, range: 3.4, icon: '⚔️', color: 0x90caf9, accent: 0xfff3b0, desc: '宽刃横扫斩击', kind: 'melee' },
        { name: '糖果巨锤', power: 20, range: 3.1, icon: '🔨', color: 0x8d6e63, accent: 0xff8fab, desc: '重击震荡冲击', kind: 'heavy' },
        { name: '藤蔓战弓', power: 25, range: 7.2, icon: '🏹', color: 0xa5d6a7, accent: 0x6ee7b7, desc: '发射闪光箭矢', kind: 'bow' },
        { name: '泡泡三叉戟', power: 30, range: 3.8, icon: '🔱', color: 0x4dd0e1, accent: 0xb2f7ef, desc: '长柄突刺波纹', kind: 'polearm' },
        { name: '雷电徽章', power: 35, range: 4.4, icon: '⚡', color: 0xfff176, accent: 0x93c5fd, desc: '短距雷光爆裂', kind: 'magic' },
        { name: '暖阳火刃', power: 40, range: 3.6, icon: '🔥', color: 0xff7043, accent: 0xffd166, desc: '火焰弧光斩击', kind: 'melee' },
        { name: '雪花冰剑', power: 45, range: 3.6, icon: '❄️', color: 0x80deea, accent: 0xc7f9ff, desc: '冰晶突进斩击', kind: 'melee' },
        { name: '星辰魔杖', power: 60, range: 5.2, icon: '💫', color: 0xce93d8, accent: 0xf0abfc, desc: '星光法术爆破', kind: 'magic' },
    ];

    /* ═══════════════════════════════════════════
       THREE.JS SCENE
    ═══════════════════════════════════════════ */
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && window.innerWidth < 900);
    const container = document.getElementById('gameContainer');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 12, 18);
    camera.lookAt(0, 1, 0);
    const cameraTarget = new THREE.Vector3(0, 1.4, 0);
    const cameraDesired = new THREE.Vector3(0, 12, 18);
    let fovKick = 0;

    const renderer = new THREE.WebGLRenderer({
        antialias: !isMobile,
        alpha: false,
        powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // ── Lighting：暖阳 + 天空半球光 + 冷色轮廓光 ──
    scene.add(new THREE.AmbientLight(0xbfd9ff, 0.55));
    const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6a8f5a, 0.85);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff0d0, 2.1);
    sun.position.set(14, 22, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
    sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
    sun.shadow.bias = -0.0008;
    scene.add(sun);
    const rimLight = new THREE.DirectionalLight(0xa8d8ff, 0.85);
    rimLight.position.set(-8, 5, -10);
    scene.add(rimLight);

    // Fog 与天际线同色，保证远景融合
    scene.fog = new THREE.FogExp2(0x9fc6e8, 0.011);

    // ── Sky Dome（带太阳光晕）──
    const skyGeo = new THREE.SphereGeometry(200, 32, 16);
    const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
            topColor: { value: new THREE.Color(0x2f7fd0) },
            bottomColor: { value: new THREE.Color(0xcfe9f7) },
            sunDir: { value: new THREE.Vector3(14, 22, 10).normalize() },
            sunColor: { value: new THREE.Color(0xfff3c4) }
        },
        vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
        fragmentShader: `
            uniform vec3 topColor; uniform vec3 bottomColor; uniform vec3 sunDir; uniform vec3 sunColor;
            varying vec3 vPos;
            void main(){
                vec3 dir = normalize(vPos);
                float h = dir.y * 0.5 + 0.5;
                vec3 col = mix(bottomColor, topColor, pow(h, 0.8));
                float s = max(dot(dir, normalize(sunDir)), 0.0);
                col += sunColor * (pow(s, 220.0) * 0.9 + pow(s, 18.0) * 0.16);
                gl_FragColor = vec4(col, 1.0);
            }`
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // ── Ground ──
    const groundGeo = new THREE.PlaneGeometry(60, 40, 64, 44);
    const gPosAttr = groundGeo.attributes.position;
    const groundHeightAt = (x, z) =>
        (Math.sin(x * 0.2) + Math.cos(-z * 0.25)) * 0.4 + (Math.sin(x * 0.8 - z * 0.5)) * 0.1;
    for (let i = 0; i < gPosAttr.count; i++) {
        gPosAttr.setZ(i, groundHeightAt(gPosAttr.getX(i), -gPosAttr.getY(i)));
    }
    groundGeo.computeVertexNormals();

    const groundCanvas = document.createElement('canvas');
    groundCanvas.width = 512; groundCanvas.height = 512;
    const gctx = groundCanvas.getContext('2d');
    const grd = gctx.createLinearGradient(0, 0, 512, 512);
    grd.addColorStop(0, '#7cc063');
    grd.addColorStop(0.5, '#55a35a');
    grd.addColorStop(1, '#93d47b');
    gctx.fillStyle = grd; gctx.fillRect(0, 0, 512, 512);
    const groundTex = new THREE.CanvasTexture(groundCanvas);
    groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
    groundTex.repeat.set(4, 3);
    const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95, flatShading: true });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const textureLoader = new THREE.TextureLoader();
    function loadSRGB(url, onLoad) {
        textureLoader.load(url, tex => { tex.colorSpace = THREE.SRGBColorSpace; onLoad && onLoad(tex); }, undefined, () => {});
    }
    // 高清草地贴图（本地资产）
    loadSRGB('/assets/ground.png', tex => {
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(5, 3.4);
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        groundMat.map = tex;
        groundMat.needsUpdate = true;
    });

    // ── 远山剪影，增加纵深 ──
    const hillMat = new THREE.MeshStandardMaterial({ color: 0x4d7fb0, roughness: 1, flatShading: true, fog: true });
    [[-46, -46, 30, 9], [40, -52, 38, 11], [0, -60, 46, 13], [-18, -54, 24, 7], [22, -44, 20, 6]].forEach(([hx, hz, hr, hh]) => {
        const hill = new THREE.Mesh(new THREE.SphereGeometry(hr, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.42), hillMat);
        hill.scale.y = hh / hr;
        hill.position.set(hx, -2, hz);
        scene.add(hill);
    });

    // ── 3D 草地（透明贴图 + 风吹摆动 + 色彩变化）──
    const grassCount = isMobile ? 2200 : 4200;
    const gBladeGeo = new THREE.PlaneGeometry(1.5, 1.55, 1, 2);
    gBladeGeo.translate(0, 0.77, 0);
    const grassGeo = new THREE.BufferGeometry();
    const gPos = []; const gUv = [];
    const pB = gBladeGeo.attributes.position.array;
    const uB = gBladeGeo.attributes.uv.array;
    for (let j = 0; j < 2; j++) {
        for (let i = 0; i < pB.length; i += 3) {
            const rot = j * Math.PI / 2;
            const rx = pB[i] * Math.cos(rot) - pB[i + 2] * Math.sin(rot);
            const rz = pB[i] * Math.sin(rot) + pB[i + 2] * Math.cos(rot);
            gPos.push(rx, pB[i + 1], rz);
            gUv.push(uB[(i / 3) * 2], uB[(i / 3) * 2 + 1]);
        }
    }
    grassGeo.setAttribute('position', new THREE.Float32BufferAttribute(gPos, 3));
    grassGeo.setAttribute('uv', new THREE.Float32BufferAttribute(gUv, 2));
    grassGeo.computeVertexNormals(); // 必须：否则光照计算失效，草地发黑

    const grassMat = new THREE.MeshStandardMaterial({
        transparent: true,
        alphaTest: 0.5,
        side: THREE.DoubleSide,
        roughness: 0.85,
        color: 0xffffff,
        onBeforeCompile: (shader) => {
            shader.uniforms.uTime = { value: 0 };
            shader.vertexShader = `uniform float uTime; varying float vHeight;\n` + shader.vertexShader.replace(
                '#include <begin_vertex>',
                `#include <begin_vertex>
                vHeight = uv.y;
                #ifdef USE_INSTANCING
                    vec4 wPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                    float sway = sin(uTime * 2.2 + wPos.x * 0.7 + wPos.z * 0.5) * 0.09
                               + sin(uTime * 3.7 + wPos.z * 1.3) * 0.035;
                    transformed.x += sway * uv.y * uv.y * 2.2;
                    transformed.z += sway * 0.5 * uv.y * uv.y;
                #endif`
            );
            shader.fragmentShader = `varying float vHeight;\n` + shader.fragmentShader.replace(
                '#include <color_fragment>',
                `#include <color_fragment>
                diffuseColor.rgb *= mix(0.62, 1.18, vHeight);`
            );
            grassMat.userData.shader = shader;
        }
    });
    loadSRGB('/assets/grass_tuft_a.png', tex => {
        grassMat.map = tex;
        grassMat.needsUpdate = true;
    });

    const grassInst = new THREE.InstancedMesh(grassGeo, grassMat, grassCount);
    grassInst.receiveShadow = false; // 草地不接收阴影，避免 shadow acne 把草染黑
    const grassDummy = new THREE.Object3D();
    const grassColor = new THREE.Color();
    for (let i = 0; i < grassCount; i++) {
        const gx = (Math.random() - 0.5) * 58;
        const gz = (Math.random() - 0.5) * 38;
        const gy = groundHeightAt(gx, gz);
        grassDummy.position.set(gx, gy - 0.02, gz);
        grassDummy.rotation.y = Math.random() * Math.PI;
        // 战斗走廊附近的草更小，保证角色可见
        const laneFactor = Math.min(1, Math.abs(gz - COMBAT_Z) / 3.6) * 0.7 + 0.3;
        grassDummy.scale.setScalar((0.7 + Math.random() * 0.7) * laneFactor + 0.2);
        grassDummy.updateMatrix();
        grassInst.setMatrixAt(i, grassDummy.matrix);
        grassColor.setHSL(0.25 + Math.random() * 0.06, 0.48 + Math.random() * 0.2, 0.58 + Math.random() * 0.24);
        grassInst.setColorAt(i, grassColor);
    }
    grassInst.instanceMatrix.needsUpdate = true;
    if (grassInst.instanceColor) grassInst.instanceColor.needsUpdate = true;
    scene.add(grassInst);

    // ── 树木（透明贴图广告牌，底部锚定地面）──
    const treeTexP = new Promise(res => loadSRGB('/assets/tree_v5_a.png', res));
    const treePositions = [[-19, 9], [-17, -7], [18, 7], [21, -8], [-15, 13], [16, -13], [23, 2], [-22, -3], [-24, 6], [25, -4]];
    const treeShadowMat = new THREE.MeshBasicMaterial({ color: 0x0a2010, transparent: true, opacity: 0.28, depthWrite: false });
    const treeShadowGeo = new THREE.CircleGeometry(2.1, 24);
    treeTexP.then(tex => {
        treePositions.forEach(([tx, tz]) => {
            const h = 8.5 + Math.random() * 3;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.35, side: THREE.DoubleSide, fog: true });
            const tree = new THREE.Mesh(new THREE.PlaneGeometry(h, h), mat);
            const gy = groundHeightAt(tx, tz);
            tree.position.set(tx, gy + h * 0.48, tz);
            tree.rotation.y = Math.random() * Math.PI;
            scene.add(tree);
            // 第二片交叉面，减轻侧视单薄感
            const tree2 = tree.clone();
            tree2.rotation.y = tree.rotation.y + Math.PI / 2;
            scene.add(tree2);
            const shadow = new THREE.Mesh(treeShadowGeo, treeShadowMat);
            shadow.rotation.x = -Math.PI / 2;
            shadow.position.set(tx, gy + 0.03, tz);
            scene.add(shadow);
        });
    });

    // ── 云朵 ──
    const clouds = [];
    loadSRGB('/assets/cloud_a.png', tex => {
        [[-14, 10, -20, 13], [11, 12.5, -24, 16], [3, 9, -17, 9], [-4, 13, -28, 18]].forEach(([cx, cy, cz, cs], i) => {
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.88, depthWrite: false, fog: false });
            const cloud = new THREE.Mesh(new THREE.PlaneGeometry(cs, cs * 0.62), mat);
            cloud.position.set(cx, cy, cz);
            cloud.userData.speed = 0.14 + i * 0.05;
            scene.add(cloud);
            clouds.push(cloud);
        });
    });

    // ── 漂浮花粉/萤火粒子 ──
    const partCount = isMobile ? 60 : 120;
    const partGeo = new THREE.BufferGeometry();
    const partPos = new Float32Array(partCount * 3);
    const partSeed = new Float32Array(partCount);
    for (let i = 0; i < partCount; i++) {
        partPos[i * 3] = (Math.random() - 0.5) * 44;
        partPos[i * 3 + 1] = 0.6 + Math.random() * 7;
        partPos[i * 3 + 2] = (Math.random() - 0.5) * 30;
        partSeed[i] = Math.random() * 100;
    }
    partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
    const partMat = new THREE.PointsMaterial({
        color: 0xfff6c9, size: 0.14, transparent: true, opacity: 0.75,
        blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    });
    const particles = new THREE.Points(partGeo, partMat);
    scene.add(particles);

    /* ═══════════════════════════════════════════
       3D CHARACTER BUILDER
    ═══════════════════════════════════════════ */
    const faceTexP = new Promise(res => loadSRGB('/assets/hero_face_a.png', res));

    function makeFallbackFaceTexture() {
        const c = document.createElement('canvas');
        c.width = c.height = 128;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 128, 128);
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath(); ctx.arc(42, 58, 9, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(86, 58, 9, 0, 7); ctx.fill();
        ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(64, 78, 16, 0.25, Math.PI - 0.25); ctx.stroke();
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
    }
    const fallbackFaceTex = makeFallbackFaceTexture();

    function createCharacter(color, opts = {}) {
        const group = new THREE.Group();
        const armorMat = new THREE.MeshStandardMaterial({ color: 0xe9edf5, roughness: 0.22, metalness: 0.82 });
        const armorDark = new THREE.MeshStandardMaterial({ color: 0x97a3b6, roughness: 0.38, metalness: 0.7 });
        const clothMat = new THREE.MeshStandardMaterial({ color, roughness: 0.82, side: THREE.DoubleSide });
        const clothDark = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.5), roughness: 0.85 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.55 });
        const leatherMat = new THREE.MeshStandardMaterial({ color: 0x4a3120, roughness: 0.8 });
        const trimMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.3, metalness: 0.9, emissive: 0xffd166, emissiveIntensity: 0.12 });
        const blackMat = new THREE.MeshBasicMaterial({ color: 0x10121c });

        // rig：除地面阴影外的全部部件，用于整体弹跳/压缩
        const rig = new THREE.Group();
        group.add(rig);

        // ── 躯干：战袍 + 胸甲 + 金边 + 斜挎绶带 + 腰带 ──
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 0.62, 4, 12), clothMat);
        body.position.y = 1.36; body.castShadow = true; rig.add(body);
        const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.37, 0.58, 12), armorMat);
        chest.position.y = 1.68; chest.castShadow = true; rig.add(chest);
        const chestTrim = new THREE.Mesh(new THREE.TorusGeometry(0.41, 0.032, 8, 20), trimMat);
        chestTrim.position.y = 1.92; chestTrim.rotation.x = Math.PI / 2; rig.add(chestTrim);
        const sash = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.72, 0.46), clothDark);
        sash.position.set(0, 1.64, 0.04); sash.rotation.z = 0.62; rig.add(sash);
        const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.375, 0.375, 0.13, 16), leatherMat);
        belt.position.y = 1.13; rig.add(belt);
        const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.05), trimMat);
        buckle.position.set(0, 1.13, 0.37); rig.add(buckle);
        // 裙甲
        for (let i = -1; i <= 1; i++) {
            const tasset = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.3, 0.05), armorDark);
            tasset.position.set(i * 0.25, 0.97, 0.2 - Math.abs(i) * 0.07);
            tasset.rotation.x = -0.18;
            rig.add(tasset);
        }

        // ── 头部：皮肤 + 脸贴图 + 细节头盔 ──
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), skinMat);
        head.position.y = 2.4; head.castShadow = true; rig.add(head);

        const faceMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(0.36, 0.36),
            new THREE.MeshBasicMaterial({ map: fallbackFaceTex, transparent: true, alphaTest: 0.1 })
        );
        faceMesh.position.set(0, 2.38, 0.27); rig.add(faceMesh);
        faceTexP.then(tex => { faceMesh.material.map = tex; faceMesh.material.needsUpdate = true; });

        const helmetBase = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.36, 0.32, 12), armorMat);
        helmetBase.position.y = 2.53; helmetBase.castShadow = true; rig.add(helmetBase);
        const helmetDome = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.55), armorMat);
        helmetDome.position.y = 2.64; rig.add(helmetDome);
        const brim = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.045, 8, 18), armorDark);
        brim.position.y = 2.41; brim.rotation.x = Math.PI / 2; rig.add(brim);
        const visorSlit = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 0.05), blackMat);
        visorSlit.position.set(0, 2.47, 0.315); rig.add(visorSlit);
        const noseGuard = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.18, 0.045), armorDark);
        noseGuard.position.set(0, 2.36, 0.325); rig.add(noseGuard);
        // 头饰：我方羽饰 / 对手牛角
        let crest;
        if (opts.horns) {
            crest = new THREE.Group();
            [-1, 1].forEach(s => {
                const horn = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.42, 8),
                    new THREE.MeshStandardMaterial({ color: 0xf3e5c0, roughness: 0.5 }));
                horn.position.set(s * 0.31, 2.78, 0);
                horn.rotation.z = -s * 0.62;
                crest.add(horn);
            });
            rig.add(crest);
        } else {
            crest = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.44, 0.5), clothMat);
            crest.position.set(0, 2.9, -0.06);
            rig.add(crest);
        }

        // ── 手臂：肩关节组(旋转轴) → 上臂 → 肘关节组 → 护腕 + 手 ──
        const createArm = (x) => {
            const g = new THREE.Group();
            g.position.set(x, 1.92, 0);
            const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.27, 12, 12), armorMat);
            s1.scale.set(1, 0.72, 1); s1.castShadow = true; g.add(s1);
            const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 10), trimMat);
            s2.position.set(x > 0 ? 0.05 : -0.05, 0.12, 0); s2.scale.set(1, 0.5, 1); g.add(s2);
            const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.28, 4, 8), armorMat);
            upper.position.set(0, -0.24, 0); g.add(upper);
            const f = new THREE.Group();
            f.position.set(0, -0.44, 0);
            const bracer = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.24, 10), armorDark);
            bracer.position.set(0, -0.1, 0); f.add(bracer);
            const hand = new THREE.Mesh(new THREE.SphereGeometry(0.115, 10, 8), leatherMat);
            hand.position.set(0, -0.3, 0); f.add(hand);
            g.add(f);
            rig.add(g);
            return { g, f, s: s1 };
        };
        const armL = createArm(-0.57), armR = createArm(0.57);

        // ── 腿：髋关节组 → 大腿 + 膝甲 → 小腿组 → 胫甲 + 靴 ──
        const createLeg = (x) => {
            const hip = new THREE.Group();
            hip.position.set(x, 0.86, 0);
            const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.26, 4, 8), clothDark);
            thigh.position.set(0, -0.18, 0); hip.add(thigh);
            const knee = new THREE.Mesh(new THREE.SphereGeometry(0.145, 10, 8), armorMat);
            knee.position.set(0, -0.34, 0.03); hip.add(knee);
            const shin = new THREE.Group();
            shin.position.set(0, -0.36, 0);
            const greave = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.3, 10), armorDark);
            greave.position.set(0, -0.17, 0); shin.add(greave);
            const boot = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.16, 0.42), leatherMat);
            boot.position.set(0, -0.36, 0.07); shin.add(boot);
            const toe = new THREE.Mesh(new THREE.BoxGeometry(0.23, 0.09, 0.12), trimMat);
            toe.position.set(0, -0.4, 0.28); shin.add(toe);
            hip.add(shin);
            rig.add(hip);
            return { hip, shin };
        };
        const legL = createLeg(-0.22), legR = createLeg(0.22);

        // ── 披风（顶点波浪动画用的基准坐标会存起来）──
        const cape = new THREE.Mesh(new THREE.PlaneGeometry(1.25, 1.95, 3, 6), clothMat);
        cape.position.set(0, 1.15, -0.48); cape.rotation.x = 0.16;
        cape.castShadow = true; rig.add(cape);
        const capeBase = cape.geometry.attributes.position.array.slice();
        const capeClasp = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), trimMat);
        capeClasp.position.set(0, 2.02, 0.4); rig.add(capeClasp);

        // ── 武器挂在右前臂，跟随手臂动作 ──
        const weaponGroup = new THREE.Group();
        weaponGroup.position.set(0, -0.34, 0.05);
        weaponGroup.rotation.set(1.5, 0, 0);
        armR.f.add(weaponGroup);

        const contact = new THREE.Mesh(new THREE.CircleGeometry(0.75, 32),
            new THREE.MeshBasicMaterial({ color: 0x061206, transparent: true, opacity: 0.32, depthWrite: false }));
        contact.rotation.x = -Math.PI / 2; contact.position.y = 0.02; group.add(contact);

        group.userData = {
            rig, body, head, chest, sash, faceMesh, helmetBase, crest, cape, capeBase,
            armL: armL.g, armR: armR.g, forearmL: armL.f, forearmR: armR.f,
            legL: legL.hip, legR: legR.hip, shinL: legL.shin, shinR: legR.shin,
            shoulderL: armL.s, shoulderR: armR.s, weaponGroup, contact,
            lungeX: 0
        };
        group.scale.setScalar(1.25);
        return group;
    }

    function makeArrowMesh(color, accent, length = 1.15) {
        const g = new THREE.Group();
        const shaft = new THREE.Mesh(
            new THREE.CylinderGeometry(0.025, 0.025, length, 8),
            new THREE.MeshStandardMaterial({ color: 0xf7e0a3, roughness: 0.52 })
        );
        shaft.rotation.z = Math.PI / 2;
        g.add(shaft);
        const tip = new THREE.Mesh(
            new THREE.ConeGeometry(0.075, 0.18, 10),
            new THREE.MeshStandardMaterial({ color, roughness: 0.25, metalness: 0.35, emissive: color, emissiveIntensity: 0.18 })
        );
        tip.rotation.z = -Math.PI / 2;
        tip.position.x = length / 2 + 0.1;
        g.add(tip);
        const featherMat = new THREE.MeshStandardMaterial({ color: accent, roughness: 0.45, emissive: accent, emissiveIntensity: 0.12, side: THREE.DoubleSide });
        for (let i = 0; i < 3; i++) {
            const feather = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.08), featherMat);
            feather.position.x = -length / 2 - 0.04;
            feather.rotation.x = (Math.PI * 2 / 3) * i;
            feather.rotation.y = Math.PI / 2;
            g.add(feather);
        }
        g.traverse(obj => { if (obj.isMesh) obj.castShadow = true; });
        return g;
    }

    function makeWeaponMesh(weaponIndex) {
        const wd = weaponData[weaponIndex];
        const g = new THREE.Group();
        const c = wd.color;
        const accent = wd.accent || c;
        const mat = new THREE.MeshStandardMaterial({ color: c, roughness: 0.28, metalness: 0.48, emissive: c, emissiveIntensity: weaponIndex > 4 ? 0.18 : 0.03 });
        const accentMat = new THREE.MeshStandardMaterial({ color: accent, roughness: 0.32, metalness: 0.24, emissive: accent, emissiveIntensity: 0.22 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x7b4f2b, roughness: 0.78 });
        const glowMat = new THREE.MeshBasicMaterial({ color: accent, transparent: true, opacity: 0.18, side: THREE.DoubleSide });
        switch (weaponIndex) {
            case 0: // fist
                g.add(new THREE.Mesh(new THREE.SphereGeometry(0.19, 14, 10), accentMat));
                g.add(new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.025, 8, 24), glowMat));
                break;
            case 1: { // sword
                g.add(new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.42, 0.07), mat));
                const tip = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.32, 4), mat);
                tip.position.y = 0.87; tip.rotation.y = Math.PI / 4; g.add(tip);
                const guard = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.09, 0.1), accentMat);
                guard.position.y = -0.62; g.add(guard);
                const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.42, 10), woodMat);
                grip.position.y = -0.9; g.add(grip);
                const gem = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 8), accentMat);
                gem.position.y = -0.55; g.add(gem);
                break;
            }
            case 2: { // hammer
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.06, 1.18, 10), woodMat);
                g.add(handle);
                const hamHead = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.42, 0.42), mat);
                hamHead.position.y = 0.58; g.add(hamHead);
                const candy = new THREE.Mesh(new THREE.TorusGeometry(0.27, 0.035, 8, 28), accentMat);
                candy.position.y = 0.58; candy.rotation.y = Math.PI / 2; g.add(candy);
                break;
            }
            case 3: { // bow
                const bow = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.045, 12, 36, Math.PI), mat);
                bow.scale.y = 1.18;
                g.add(bow);
                const string = new THREE.Mesh(new THREE.BoxGeometry(0.02, 1.32, 0.02), accentMat);
                string.position.x = -0.56; g.add(string);
                const heldArrow = makeArrowMesh(c, accent, 0.95);
                heldArrow.position.set(-0.08, 0, 0.05);
                g.add(heldArrow);
                const leafTop = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), accentMat);
                leafTop.scale.set(1.8, 0.72, 0.35);
                leafTop.position.set(0.08, 0.46, 0);
                g.add(leafTop);
                const leafBottom = leafTop.clone();
                leafBottom.position.y = -0.46;
                g.add(leafBottom);
                break;
            }
            case 4: { // trident
                const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.55, 8), mat);
                g.add(shaft);
                for (let dx of [-0.18, 0, 0.18]) {
                    const prong = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.34, 8), mat);
                    prong.position.set(dx, 0.92, 0); g.add(prong);
                }
                const cross = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.06, 0.06), accentMat);
                cross.position.y = 0.72; g.add(cross);
                const bubble = new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 10), accentMat);
                bubble.position.set(0, 0.44, 0); bubble.material.transparent = true; bubble.material.opacity = 0.72; g.add(bubble);
                break;
            }
            default: { // magical weapons (5-8)
                const staff = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 1.35, 8), woodMat);
                g.add(staff);
                const orb = new THREE.Mesh(new THREE.SphereGeometry(0.23, 18, 12),
                    new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.95, roughness: 0.1 }));
                orb.position.y = 0.76; g.add(orb);
                const halo = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.022, 8, 32), accentMat);
                halo.position.y = 0.76; halo.rotation.x = Math.PI / 2; g.add(halo);
                const glowDisc = new THREE.Mesh(new THREE.CircleGeometry(0.46, 32), glowMat);
                glowDisc.position.y = 0.76; glowDisc.rotation.x = Math.PI / 2; g.add(glowDisc);
                const glow = new THREE.PointLight(c, 1.4, 5);
                glow.position.y = 0.76; g.add(glow);
                break;
            }
        }
        g.scale.setScalar(1.22);
        g.traverse(obj => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
        return g;
    }

    let char1, char2;
    function initCharacters() {
        const c1Color = myPlayerNum === 1 ? 0x43A047 : 0x1E88E5;
        char1 = createCharacter(c1Color);
        scene.add(char1);
        char2 = createCharacter(0xE53935, { horns: true });
        scene.add(char2);
        updateWeaponMesh(char1, 0);
        updateWeaponMesh(char2, 0);
    }

    function updateWeaponMesh(char, weaponIndex) {
        const wg = char.userData.weaponGroup;
        while (wg.children.length) {
            const old = wg.children[0];
            wg.remove(old);
            old.traverse(obj => {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material?.dispose) obj.material.dispose();
            });
        }
        wg.add(makeWeaponMesh(weaponIndex));
    }

                isStar ? fxGeos.star : fxGeos.spark,

            );

    function spawnSlashEffect(char, facingRight, variant = 0) {
        const weapon = weaponData[char === char1 ? localPlayer.weapon : remotePlayer.weapon] || weaponData[0];
        const dir = facingRight ? 1 : -1;
        const addLight = (mesh, color, intensity) => {
            const light = new THREE.PointLight(color, intensity, 6);
            light.position.copy(mesh.position);
            scene.add(light);
            return light;
        };
        if (weapon.kind === 'heavy') {
            // v0 横扫：地面冲击波；v1 跳劈：更大的震荡 + 金色命中环
            const shock = new THREE.Mesh(fxGeos.shock, fxMats.shock.clone());
            shock.position.copy(char.position);
            shock.position.x += dir * (variant === 1 ? 0.95 : 0.65);
            shock.position.y = 0.09;
            shock.rotation.x = -Math.PI / 2;
            if (variant === 1) shock.scale.setScalar(1.5);
            scene.add(shock);
            const light = addLight(shock, 0xffa500, variant === 1 ? 5.0 : 3.5);
            effects.push({ mesh: shock, type: 'shock', life: 0, maxLife: variant === 1 ? 0.5 : 0.42, light, maxLightIntensity: variant === 1 ? 5.0 : 3.5 });
            if (variant === 1) {
                const ring = new THREE.Mesh(fxGeos.ringSmall, fxMats.hitRing.clone());
                ring.position.copy(shock.position); ring.position.y = 0.4;
                ring.rotation.x = -Math.PI / 2;
                scene.add(ring);
                effects.push({ mesh: ring, type: 'ring', life: 0, maxLife: 0.45 });
            }
            return;
        }
        if (weapon.kind === 'polearm') {
            if (variant === 1) {
                // 大回环：宽刃弧光
                const sweep = new THREE.Mesh(
                    fxGeos.slash,
                    new THREE.MeshBasicMaterial({ color: weapon.accent, transparent: true, opacity: 0.75, side: THREE.DoubleSide })
                );
                sweep.position.copy(char.position);
                sweep.position.y = 1.6;
                sweep.rotation.y = facingRight ? 0 : Math.PI;
                sweep.scale.set(1.45, 0.75, 1.45);
                scene.add(sweep);
                const light = addLight(sweep, weapon.accent, 3.2);
                effects.push({ mesh: sweep, type: 'slash', life: 0, maxLife: 0.38, light, maxLightIntensity: 3.2 });
                return;
            }
            const thrust = new THREE.Mesh(
                fxGeos.thrust,
                new THREE.MeshBasicMaterial({ color: weapon.accent, transparent: true, opacity: 0.78 })
            );
            thrust.position.copy(char.position);
            thrust.position.x += dir * 1.32;
            thrust.position.y = 1.62;
            thrust.rotation.z = facingRight ? -Math.PI / 2 : Math.PI / 2;
            scene.add(thrust);
            const light = addLight(thrust, weapon.accent, 2.5);
            effects.push({ mesh: thrust, type: 'thrust', life: 0, maxLife: 0.28, dir, light, maxLightIntensity: 2.5 });
            return;
        }
        if (weapon.kind === 'magic') {
            // v1 高举召雷：更高更大的爆发
            const burst = new THREE.Mesh(
                fxGeos.burst,
                new THREE.MeshBasicMaterial({ color: weapon.color, transparent: true, opacity: 0.5 })
            );
            burst.position.copy(char.position);
            burst.position.x += dir * 1.05;
            burst.position.y = variant === 1 ? 2.4 : 1.65;
            if (variant === 1) burst.scale.setScalar(1.35);
            scene.add(burst);
            const light = addLight(burst, weapon.color, variant === 1 ? 5.5 : 4.0);
            effects.push({ mesh: burst, type: 'burst', life: 0, maxLife: 0.34, light, maxLightIntensity: variant === 1 ? 5.5 : 4.0 });
            return;
        }

        // 拳套第三段上勾拳：爆发特效
        if (weapon.name.includes('拳') && variant === 2) {
            const burst = new THREE.Mesh(
                fxGeos.burst,
                new THREE.MeshBasicMaterial({ color: weapon.accent, transparent: true, opacity: 0.6 })
            );
            burst.position.copy(char.position);
            burst.position.x += dir * 0.8;
            burst.position.y = 2.1;
            burst.scale.setScalar(0.75);
            scene.add(burst);
            const light = addLight(burst, weapon.accent, 3.5);
            effects.push({ mesh: burst, type: 'burst', life: 0, maxLife: 0.3, light, maxLightIntensity: 3.5 });
            return;
        }

        const slash = new THREE.Mesh(
            fxGeos.slash,
            new THREE.MeshBasicMaterial({ color: weapon.accent || 0xffffff, transparent: true, opacity: weapon.kind === 'melee' ? 0.82 : 0.7, side: THREE.DoubleSide })
        );
        slash.position.copy(char.position);
        slash.position.y = 1.72;
        slash.position.x += dir * (weapon.name.includes('拳') ? 0.72 : 1.08);
        slash.position.z += weapon.name.includes('冰') ? -0.18 : 0.18;
        slash.rotation.y = facingRight ? 0 : Math.PI;
        if (variant === 1) {
            // 回斩：反向倾斜
            slash.rotation.z = facingRight ? 0.32 : -0.32;
            slash.rotation.x = 0.3;
        } else if (variant === 2) {
            // 力劈：竖直下劈
            slash.rotation.z = facingRight ? -1.35 : 1.35;
            slash.position.y = 2.0;
            slash.scale.setScalar(1.15);
        } else {
            slash.rotation.z = facingRight ? -0.28 : 0.28;
        }
        if (weapon.name.includes('火')) slash.scale.multiply(new THREE.Vector3(1.1, 0.85, 1.1));
        if (weapon.name.includes('冰')) slash.scale.multiply(new THREE.Vector3(0.82, 1.24, 0.82));
        if (weapon.name.includes('拳')) slash.scale.multiply(new THREE.Vector3(0.58, 0.58, 0.58));
        scene.add(slash);
        const light = addLight(slash, weapon.accent || 0xffffff, 3.0);
        effects.push({ mesh: slash, type: weapon.name.includes('拳') ? 'punch' : 'slash', life: 0, maxLife: 0.34, light, maxLightIntensity: 3.0 });
    }

    function spawnArrowEffect(char, facingRight, weaponIndex) {
        const weapon = weaponData[weaponIndex] || weaponData[3];
        const arrow = makeArrowMesh(weapon.color, weapon.accent, 1.28);

        arrow.position.x += dir * 0.75;

        });
