    function updateEffects(dt) {
        for (let i = effects.length - 1; i >= 0; i--) {
            const e = effects[i];
            e.life += dt;
            const t = e.life / e.maxLife;
            if (e.light) e.light.intensity = e.maxLightIntensity * (1 - Math.pow(t, 2));
            if (t >= 1) {
                scene.remove(e.mesh);
                if (e.light) scene.remove(e.light);
                e.mesh.traverse?.(obj => {
                    if (e.disposeGeometry && obj.geometry) obj.geometry.dispose();
                    if (obj.material?.dispose) obj.material.dispose();
                });
                if (e.mesh.material?.dispose) e.mesh.material.dispose();
                effects.splice(i, 1);
                continue;
            }
            if (e.type === 'ring') {
                const s = 1 + t * 4;
                e.mesh.scale.set(s, s, s);
                e.mesh.material.opacity = 1 - t;
            } else if (e.type === 'spark') {
                e.mesh.position.add(e.vel.clone().multiplyScalar(dt));
                e.vel.y -= 15 * dt;
                e.mesh.rotation.x += dt * 8;
                e.mesh.rotation.y += dt * 11;
                e.mesh.material.opacity = 1 - t;
            } else if (e.type === 'slash') {
                e.mesh.material.opacity = 1 - t;
                const s = 1 + t * 0.75;
                e.mesh.scale.set(s, s, s);
                e.mesh.rotation.z += dt * 4;
            } else if (e.type === 'punch') {
                e.mesh.material.opacity = 1 - t;
                const s = 0.62 + t * 0.85;
                e.mesh.scale.set(s, s, s);
                e.mesh.position.x += (e.mesh.rotation.y === 0 ? 1 : -1) * dt * 1.8;
                if (e.light) e.light.position.copy(e.mesh.position);
            } else if (e.type === 'shock') {
                e.mesh.material.opacity = 0.78 * (1 - t);
                const s = 1 + t * 3.6;
                e.mesh.scale.set(s, s, s);
            } else if (e.type === 'thrust') {
                e.mesh.material.opacity = 0.78 * (1 - t);
                e.mesh.position.x += e.dir * dt * 4.5;
                e.mesh.scale.set(1 + t * 0.35, 1 + t * 0.9, 1 + t * 0.35);
                if (e.light) e.light.position.copy(e.mesh.position);
            } else if (e.type === 'burst') {
                e.mesh.material.opacity = 0.5 * (1 - t);
                const s = 0.7 + t * 2.2;
                e.mesh.scale.set(s, s, s);
            } else if (e.type === 'arrow') {
                e.mesh.position.add(e.vel.clone().multiplyScalar(dt));
                e.mesh.position.y += Math.sin(t * Math.PI) * 0.012;
                e.mesh.scale.setScalar(1 + t * 0.18);
                if (e.light) e.light.position.copy(e.mesh.position);

                // 命中检测：谁射的箭，谁端判定
                const targetX = e.fromLocal ? remotePlayer.x : localPlayer.x;
                const weapon = weaponData[e.fromLocal ? localPlayer.weapon : remotePlayer.weapon];
                if (!e.hit && Math.abs(e.mesh.position.x - targetX) < 0.8 && e.mesh.position.y < 2.5 && e.mesh.position.y > 0.5) {
                    e.hit = true;
                    const dmg = weapon.power;
                    if (e.fromLocal) {
                        if (!practiceMode) socket.emit('gameAction', { roomId, action: { type: 'hit', damage: dmg } });
                        if (char2) { spawnHitEffect(char2.position); cameraShake(0.15); hitStop(); }
                        remotePlayer.health = Math.max(0, remotePlayer.health - dmg);
                        remotePlayer.hurt = true;
                        updateHealthUI('opponent');
                        setTimeout(() => { remotePlayer.hurt = false; }, 300);
                        if (remotePlayer.health <= 0) endGame(true);
                    } else if (practiceMode) {
                        // 练习模式机器人射箭命中
                        localPlayer.health = Math.max(0, localPlayer.health - dmg);
                        localPlayer.hurt = true;
                        updateHealthUI('player');
                        if (char1) { spawnHitEffect(char1.position); cameraShake(0.3); hitStop(); damageFlash(); }
                        popupAt(char1, -dmg);
                        audio.play('hurt');
                        setTimeout(() => { localPlayer.hurt = false; }, 300);
                        if (localPlayer.health <= 0) endGame(false);
                    }
                    e.life = e.maxLife;
                }

                e.mesh.children.forEach(child => {
                    if (child.material?.opacity !== undefined) child.material.opacity = Math.max(0, 0.46 * (1 - t));
                });
            }
        }
    }

    let shakeTimer = 0;
    let shakePower = 0;
    function cameraShake(intensity) {
        shakeTimer = 0.28;
        shakePower = Math.max(shakePower, intensity);
        fovKick = Math.min(6, fovKick + intensity * 6);
    }

    function popupAt(char, delta) {
        const v = char.position.clone();
        v.y += 2.2;
        v.project(camera);
        showDamagePopup(delta, (v.x * 0.5 + 0.5) * window.innerWidth, (-v.y * 0.5 + 0.5) * window.innerHeight);
    }

    function showDamagePopup(damage, screenX, screenY) {
        const popup = document.createElement('div');
        const isHeal = damage > 0;
        const isCrit = damage <= -35;
        popup.className = 'dmg-popup' + (isHeal ? ' heal' : '') + (isCrit ? ' crit' : '');
        popup.textContent = isHeal ? `+${damage}` : `${damage}`;
        popup.style.left = (screenX - 14 + (Math.random() - 0.5) * 30) + 'px';
        popup.style.top = (screenY - 10) + 'px';
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 900);
    }

    function damageFlash() {
        const el = document.getElementById('damageFlash');
        el.classList.remove('on');
        void el.offsetWidth;
        el.classList.add('on');
    }

    /* ═══════════════════════════════════════════
       SKY DROPS
    ═══════════════════════════════════════════ */
    const drops = new Map();
    let nextDropAt = 0;
    const dropGeo = {
        meteor: new THREE.DodecahedronGeometry(0.46, 0),
        flame: new THREE.ConeGeometry(0.45, 1.25, 10)
    };
    const dropMat = {
        meteor: new THREE.MeshStandardMaterial({ color: 0x5d4037, emissive: 0xff6d00, emissiveIntensity: 0.32, roughness: 0.78, flatShading: true }),
        flame: new THREE.MeshBasicMaterial({ color: 0xffb703, transparent: true, opacity: 0.44, side: THREE.DoubleSide })
    };

    function createDropMesh(type) {
        const g = new THREE.Group();
        if (type === 'health') {
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }));
            box.castShadow = true;
            g.add(box);
            const crossMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, emissive: 0x2ecc71, emissiveIntensity: 0.5 });
            g.add(new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.45, 0.62), crossMat));
            g.add(new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.15, 0.62), crossMat));
            g.add(new THREE.PointLight(0x2ecc71, 1.2, 4));
            g.userData.isHealth = true;
        } else {
            const rock = new THREE.Mesh(dropGeo.meteor, dropMat.meteor);
            rock.castShadow = true;
            g.add(rock);
            const flame = new THREE.Mesh(dropGeo.flame, dropMat.flame.clone());
            flame.position.y = 0.6;
            g.add(flame);
            g.add(new THREE.PointLight(0xff8a00, 1.5, 6));
            g.userData.rock = rock;
        }
        return g;
    }

    function spawnSkyDrop(data) {
        if (drops.has(data.id)) return;
        const mesh = createDropMesh(data.type);
        mesh.position.set(data.x, 12, data.z);
        scene.add(mesh);
        drops.set(data.id, {
            id: data.id,
            type: data.type,
            mesh,
            yVel: data.type === 'meteor' ? -8.6 : -4.4,
            collected: false,
            landedAt: 0
        });
    }

    function scheduleNextDrop(time) {
        nextDropAt = time + 4.5 + Math.random() * 3.5;
    }

    function maybeHostDrop(time) {
        if (!gameStarted || matchOver || time < nextDropAt) return;
        if (!practiceMode && myPlayerNum !== 1) return;
        const data = {
            id: `${roomId}_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
            type: Math.random() < 0.52 ? 'health' : 'meteor',
            x: -10.5 + Math.random() * 21,
            z: COMBAT_Z
        };
        spawnSkyDrop(data);
        if (!practiceMode) socket.emit('gameAction', { roomId, action: { type: 'dropSpawn', drop: data } });
        scheduleNextDrop(time);
    }

    function removeDrop(id) {
        const drop = drops.get(id);
        if (!drop) return;
        scene.remove(drop.mesh);
        drop.mesh.traverse(obj => { if (obj.material?.dispose && obj.material !== dropMat.meteor && obj.material !== dropMat.flame) obj.material.dispose(); });
        drops.delete(id);
    }

    function applyDropToLocal(drop) {
        if (drop.collected) return;
        drop.collected = true;
        const intendedDelta = drop.type === 'health' ? 20 : -20;
        const before = localPlayer.health;
        localPlayer.health = Math.max(0, Math.min(localPlayer.maxHealth, localPlayer.health + intendedDelta));
        const delta = localPlayer.health - before;
        updateHealthUI('player');
        cameraShake(drop.type === 'meteor' ? 0.32 : 0.12);
        if (delta !== 0 && char1) popupAt(char1, delta);
        if (!practiceMode) socket.emit('gameAction', { roomId, action: { type: 'dropCollect', id: drop.id, dropType: drop.type, health: localPlayer.health } });
        removeDrop(drop.id);
        if (localPlayer.health <= 0) endGame(false);
    }

    function updateDrops(dt, time) {
        maybeHostDrop(time);
        drops.forEach(drop => {
            drop.mesh.position.y += drop.yVel * dt;
            if (drop.mesh.userData.rock) {
                drop.mesh.userData.rock.rotation.y += dt * 4.2;
                drop.mesh.userData.rock.rotation.x += dt * 2.5;
            } else if (drop.type === 'health') {
                drop.mesh.rotation.y += dt * 1.8;
                drop.mesh.position.y += Math.sin(time * 4 + drop.mesh.position.x) * 0.004;
            }
            if (drop.mesh.position.y <= 0.65 && !drop.landedAt) {
                audio.play('drop');
                drop.mesh.position.y = 0.65;
                drop.landedAt = time;
                if (drop.type === 'meteor') {
                    const shock = new THREE.Mesh(fxGeos.shock, fxMats.shock.clone());
                    shock.position.set(drop.mesh.position.x, 0.08, drop.mesh.position.z);
                    shock.rotation.x = -Math.PI / 2;
                    scene.add(shock);
                    effects.push({ mesh: shock, type: 'shock', life: 0, maxLife: 0.34 });
                }
            }
            if (!drop.collected && char1 && drop.mesh.position.y < 1.35) {
                const dist = Math.abs(localPlayer.x - drop.mesh.position.x);
                if (dist < (drop.type === 'meteor' ? 1.05 : 0.9)) applyDropToLocal(drop);
            }
            if (drop.landedAt && time - drop.landedAt > (drop.type === 'meteor' ? 1.1 : 8)) removeDrop(drop.id);
        });
    }

    /* ═══════════════════════════════════════════
       ANIMATION — 缓动函数 / 连击数 / 角色动画
    ═══════════════════════════════════════════ */
    const Ease = {
        outCubic: t => 1 - Math.pow(1 - t, 3),
        inCubic: t => t * t * t,
        outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
        outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1
    };

    function attackVariantCount(weapon) {
        if (weapon.name.includes('拳')) return 3;
        switch (weapon.kind) {
            case 'melee': return 3;
            case 'heavy': case 'polearm': case 'magic': return 2;
            default: return 1; // bow
        }
    }

    function animateCharacter(char, state, time) {
        const d = char.userData;
        const rig = d.rig;

        // ── 死亡倒地（KO 慢动作里演出）──
        if (state.dead) {
            const t = Math.min(1, (time - (state.deadAt || 0)) / 0.8);
            const e = Ease.inCubic(t);
            char.rotation.x = -1.5 * e;
            char.rotation.z = 0.14 * e;
            d.contact.material.opacity = 0.32 * (1 - e * 0.6);
            return;
        }

        // ── 受击闪红 + 后仰 ──
        if (state.hurt) {
            const flash = Math.sin(time * 40) > 0;
            d.body.material.emissive.setHex(flash ? 0xff0000 : 0x000000);
            d.head.material.emissive.setHex(flash ? 0xff0000 : 0x000000);
            d.chest.material.emissive.setHex(flash ? 0xffd166 : 0x000000);
        } else {
            d.body.material.emissive.setHex(0x000000);
            d.head.material.emissive.setHex(0x000000);
            d.chest.material.emissive.setHex(0x000000);
        }

        const speed = Math.abs(state.vx || 0);
        const moveT = Math.min(1, speed / 9.6);
        d.lungeX = 0;
        // 每帧先复位临时变换
        rig.scale.set(1, 1, 1);
        rig.rotation.set(0, 0, 0);
        rig.position.y = 0;
        d.armL.position.z = 0; d.armR.position.z = 0;

        if (state.attacking) {
            /* ── 攻击：蓄势(windup) → 挥出(release) → 收势(recover) 三段曲线 ── */
            const weapon = weaponData[state.weapon] || weaponData[0];
            const v = state.attackVariant || 0;
            const T = weapon.kind === 'heavy' ? 0.52 : (weapon.kind === 'bow' && v === 1 ? 0.3 : 0.42);
            const age = Math.max(0, time - (state.attackStart >= 0 ? state.attackStart : time));
            const p = Math.min(1, age / T);
            const windup = p < 0.32 ? Ease.outCubic(p / 0.32) : 1;
            const release = p < 0.32 ? 0 : (p < 0.6 ? Ease.inCubic((p - 0.32) / 0.28) : 1);
            const recover = p < 0.6 ? 0 : Ease.outCubic((p - 0.6) / 0.4);
            const swing = release;
            const dir = state.facingRight ? 1 : -1;
            // 攻击突进（脚步跟手）
            d.lungeX = dir * release * (1 - recover) * (weapon.kind === 'heavy' ? 0.4 : 0.6);
            rig.rotation.x = 0.08 * swing;

            if (weapon.kind === 'bow') {
                // 拉弓：左臂前推，右臂后拉
                d.armR.rotation.set(-1.35, 0, -0.1);
                d.forearmR.rotation.x = -0.1;
                d.armL.rotation.set(-1.15 - windup * 0.1, 0, 0.25);
                d.forearmL.rotation.x = -0.9 * windup;
                rig.rotation.y = -0.28 * windup;
                rig.rotation.x = 0.05;
            } else if (weapon.kind === 'heavy') {
                if (v === 0) { // 横扫重击
                    d.armR.rotation.x = -1.3;
                    d.forearmR.rotation.x = -0.15;
                    d.armR.rotation.z = 1.25 * windup - 2.6 * swing + 0.8 * recover;
                    rig.rotation.y = 0.4 * windup - 0.8 * swing;
                    rig.rotation.x = 0.15 * swing;
                } else { // 跳劈
                    d.armR.rotation.x = -2.6 * windup + 2.5 * swing;
                    d.armL.rotation.x = -2.4 * windup + 2.3 * swing;
                    d.forearmR.rotation.x = -0.4 * (1 - swing);
                    d.forearmL.rotation.x = -0.4 * (1 - swing);
                    rig.position.y = 0.16 * windup * (1 - swing) - 0.14 * swing;
                    rig.rotation.x = 0.3 * swing;
                }
            } else if (weapon.kind === 'polearm') {
                if (v === 0) { // 突刺
                    d.armR.rotation.x = -1.15;
                    d.forearmR.rotation.x = -0.5 * (1 - swing);
                    d.armR.position.z = 0.55 * swing;
                    rig.rotation.x = 0.22 * swing;
                    rig.rotation.y = -0.3 * swing;
                } else { // 大回环横扫
                    d.armR.rotation.x = -1.4;
                    d.forearmR.rotation.x = -0.1;
                    d.armR.rotation.z = 1.2 * windup - 2.6 * swing;
                    rig.rotation.y = 0.5 * windup - 1.0 * swing;
                }
            } else if (weapon.kind === 'magic') {
                if (v === 0) { // 法球推出
                    d.armR.rotation.x = -0.7 - 0.4 * windup - 0.5 * swing;
                    d.forearmR.rotation.x = -0.7 * (1 - swing);
                    rig.rotation.y = 0.25 * windup - 0.5 * swing;
                } else { // 高举法杖召雷
                    d.armR.rotation.x = -2.5 * windup - 0.1 * swing + 2.2 * recover;
                    d.armL.rotation.x = -2.2 * windup + 2.0 * recover;
                    rig.position.y = 0.1 * windup * (1 - recover);
                }
            } else if (weapon.name.includes('拳')) {
                if (v === 0) { // 右直拳
                    d.armR.rotation.x = -0.6 - 0.2 * windup - 0.85 * swing + 0.6 * recover;
                    d.forearmR.rotation.x = -0.8 * (1 - swing);
                    rig.rotation.y = 0.15 - 0.4 * swing;
                    d.armL.rotation.x = -0.5; d.forearmL.rotation.x = -0.9;
                } else if (v === 1) { // 左摆拳
                    d.armL.rotation.x = -1.1;
                    d.armL.rotation.z = -1.0 * windup + 1.7 * swing - 0.5 * recover;
                    d.forearmL.rotation.x = -0.4;
                    rig.rotation.y = -0.2 + 0.45 * swing;
                    d.armR.rotation.x = -0.5; d.forearmR.rotation.x = -0.9;
                } else { // 右上勾拳
                    d.armR.rotation.x = -0.3 - 0.3 * windup - 1.9 * swing + 1.4 * recover;
                    d.forearmR.rotation.x = -1.0 + 0.6 * swing;
                    rig.position.y = Math.sin(swing * Math.PI) * 0.16;
                    rig.rotation.x = -0.12 * swing;
                }
            } else { // melee 刀剑三连击
                d.forearmR.rotation.x = -0.2;
                if (v === 0) { // 横斩
                    d.armR.rotation.x = -1.35;
                    d.armR.rotation.z = 1.05 * windup - 2.35 * swing + 0.8 * recover;
                    rig.rotation.y = 0.35 * windup - 0.7 * swing;
                } else if (v === 1) { // 回斩
                    d.armR.rotation.x = -1.35;
                    d.armR.rotation.z = -1.15 * windup + 2.45 * swing - 0.9 * recover;
                    rig.rotation.y = -0.4 * windup + 0.75 * swing;
                } else { // 力劈华山
                    d.armR.rotation.x = -2.5 * windup + 2.15 * swing - 0.3 * recover;
                    d.forearmR.rotation.x = -0.5 * (1 - swing);
                    rig.position.y = -0.1 * swing;
                    rig.rotation.x = 0.28 * swing;
                    rig.rotation.y = 0;
                }
            }
            if (d.cape) d.cape.rotation.x = 0.3 + swing * 0.2;
        } else if (state.dodging) {
            /* ── 闪避：团身后跳 ── */
            rig.scale.set(1.07, 0.88, 1.07);
            rig.rotation.x = -0.2;
            char.rotation.z = state.facingRight ? -0.45 : 0.45;
            d.armL.rotation.set(0.35, 0, 0.55); d.forearmL.rotation.x = -1.1;
            d.armR.rotation.set(0.35, 0, -0.55); d.forearmR.rotation.x = -1.1;
            d.legL.rotation.x = 0.55; d.shinL.rotation.x = 1.0;
            d.legR.rotation.x = -0.4; d.shinR.rotation.x = 0.75;
            if (d.cape) d.cape.rotation.x = 0.5;
        } else {
            /* ── 移动 / 待机 混合 ── */
            char.rotation.z = 0;
            const f = time * (6.5 + 5.5 * moveT);          // 步频随速度
            const s0 = Math.sin(f), s1 = Math.sin(f + Math.PI);
            // 双腿对摆 + 膝盖屈伸（后摆时弯膝）
            d.legL.rotation.x = s0 * 0.72 * moveT;
            d.legR.rotation.x = s1 * 0.72 * moveT;
            d.shinL.rotation.x = Math.max(0, -Math.sin(f - 0.6)) * 0.95 * moveT;
            d.shinR.rotation.x = Math.max(0, -Math.sin(f + Math.PI - 0.6)) * 0.95 * moveT;
            // 双臂对摆（与腿反相）+ 肘部微屈
            d.armL.rotation.x = s1 * 0.5 * moveT;
            d.armR.rotation.x = s0 * 0.5 * moveT;
            d.armL.rotation.z = 0.12; d.armR.rotation.z = -0.12;
            d.forearmL.rotation.x = -0.25 - Math.max(0, s1) * 0.3 * moveT - 0.05;
            d.forearmR.rotation.x = -0.25 - Math.max(0, s0) * 0.3 * moveT - 0.05;
            // 身体：跑步前倾 + 上下颠 + 待机呼吸
            const idleBob = Math.sin(time * 2.4) * 0.022;
            rig.position.y = Math.abs(Math.cos(f)) * 0.075 * moveT + idleBob;
            rig.rotation.x = 0.1 * moveT;
            rig.rotation.z = Math.sin(f) * 0.03 * moveT;
            // 呼吸（胸甲起伏）
            const breath = 1 + Math.sin(time * 2.4) * 0.02 * (1 - moveT * 0.6);
            d.chest.scale.set(breath, 1, breath);
            // 头部小动作 + 眨眼
            d.head.rotation.y = Math.sin(time * 0.7) * 0.14 * (1 - moveT);
            d.head.rotation.z = Math.sin(time * 1.1) * 0.04;
            const blink = (time % 3.7) < 0.12 ? 0.12 : 1;
            d.faceMesh.scale.y = blink;
            if (d.cape) d.cape.rotation.x = 0.16 + moveT * 0.35;
        }

        // ── 受击后仰叠加 ──
        if (state.hurt) rig.rotation.x -= 0.22;

        // ── 披风顶点波浪 ──
        if (d.cape) {
            const pos = d.cape.geometry.attributes.position;
            const amp = 0.05 + moveT * 0.12;
            for (let i = 0; i < pos.count; i++) {
                const bx = d.capeBase[i * 3], by = d.capeBase[i * 3 + 1];
                const factor = Math.max(0, (1 - (by + 0.975) / 1.95)); // 顶部固定，越往下摆动越大
                pos.array[i * 3 + 2] = d.capeBase[i * 3 + 2] + Math.sin(time * 3.2 + by * 2.4 + bx * 1.2) * amp * factor;
                pos.array[i * 3] = bx + Math.sin(time * 2.1 + by * 1.6) * amp * 0.4 * factor;
            }
            pos.needsUpdate = true;
        }
        // 头饰摆动
        if (d.crest) d.crest.rotation.x = Math.sin(time * 3) * 0.09 - moveT * 0.25;

        // 阴影随起跳缩放
        const h = rig.position.y;
        d.contact.scale.setScalar(Math.max(0.6, 1 - h * 0.8));
        d.contact.material.opacity = 0.32 * Math.max(0.4, 1 - h * 1.2);

        char.rotation.y = state.facingRight ? Math.PI * 0.42 : -Math.PI * 0.42;
        char.position.x = state.x + d.lungeX;
    }

    /* ═══════════════════════════════════════════
       SOCKET EVENTS
    ═══════════════════════════════════════════ */
    const connEl = document.getElementById('connStatus');
    function setConn(ok, text) {
        connEl.textContent = text;
        connEl.classList.toggle('ok', ok);
        connEl.classList.toggle('bad', !ok);
    }
    socket.on('connect', () => setConn(true, '● 已连接'));
    socket.on('disconnect', () => setConn(false, '● 连接断开'));
    socket.on('connect_error', () => setConn(false, '● 连接异常'));

    socket.on('waiting', () => {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'flex';
    });

    socket.on('gameStart', (data) => {
        practiceMode = false;
        beginMatch(data);
    });

    socket.on('opponentAction', (action) => {
        if (action.type === 'move') {
            remotePlayer.targetX = action.x;
            remotePlayer.vx = action.vx;
            remotePlayer.facingRight = action.facingRight;
        } else if (action.type === 'attack') {
            remotePlayer.attacking = true;
            remotePlayer.attackStart = clock.getElapsedTime();
            remotePlayer.facingRight = action.facingRight;
            if (typeof action.weapon === 'number') remotePlayer.weapon = action.weapon;
            remotePlayer.attackVariant = action.combo || 0;
            if (char2) {
                const weapon = weaponData[remotePlayer.weapon] || weaponData[0];
                if (weapon.kind === 'bow') spawnArrowEffect(char2, action.facingRight, remotePlayer.weapon);
                else spawnSlashEffect(char2, action.facingRight, remotePlayer.attackVariant);
            }
            setTimeout(() => { remotePlayer.attacking = false; }, 420);
        } else if (action.type === 'dodge') {
            remotePlayer.dodging = true;
            remotePlayer.vx = action.vx;
            setTimeout(() => { remotePlayer.dodging = false; }, 400);
        } else if (action.type === 'weapon') {
            remotePlayer.weapon = action.weapon;
            if (char2) updateWeaponMesh(char2, action.weapon);
            updateWeaponPanel('opponent', true);
        } else if (action.type === 'dropSpawn') {
            if (action.drop) spawnSkyDrop(action.drop);
        } else if (action.type === 'dropCollect') {
            removeDrop(action.id);
            if (typeof action.health === 'number') {
                const before = remotePlayer.health;
                remotePlayer.health = Math.max(0, Math.min(remotePlayer.maxHealth, action.health));
                updateHealthUI('opponent');
                if (char2) {
                    if (action.dropType === 'meteor') {
                        remotePlayer.hurt = true;
                        spawnHitEffect(char2.position);
                        setTimeout(() => { remotePlayer.hurt = false; }, 300);
                    }
                    const delta = remotePlayer.health - before;
                    if (delta !== 0) popupAt(char2, delta);
                }
                if (remotePlayer.health <= 0) endGame(true);
            }
        } else if (action.type === 'hit') {
            if (matchOver) return;
            localPlayer.health = Math.max(0, localPlayer.health - action.damage);
            localPlayer.hurt = true;
            updateHealthUI('player');
            if (char1) {
                spawnHitEffect(char1.position);
                cameraShake(0.3);
                hitStop();
                damageFlash();
                popupAt(char1, -action.damage);
            }
            audio.play('hurt');
            setTimeout(() => { localPlayer.hurt = false; }, 300);
            if (localPlayer.health <= 0) endGame(false);
        }
    });

    socket.on('opponentLeft', (data) => {
        if (matchOver) return;
        opponentLeft = true;
        matchOver = true;
        showGameOverScreen({
            emoji: '🚪',
            text: '对手离开了游戏',
            color: '#ffd43b',
            sub: data?.message || '返回主页可重新匹配'
        });
    });

    /* ═══════════════════════════════════════════
       MATCH LIFECYCLE
    ═══════════════════════════════════════════ */
    function beginMatch(data) {
        roomId = data.roomId;
        myPlayerNum = data.playerNum;
        gameStarted = true;
        matchOver = false;
        opponentLeft = false;
        canAct = false;

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'none';
        document.getElementById('uiOverlay').style.display = 'block';

        if (myPlayerNum === 1) {
            localPlayer.x = -5; remotePlayer.x = 5; remotePlayer.targetX = 5;
            localPlayer.facingRight = true; remotePlayer.facingRight = false;
        } else {
            localPlayer.x = 5; remotePlayer.x = -5; remotePlayer.targetX = -5;
            localPlayer.facingRight = false; remotePlayer.facingRight = true;
        }
        localPlayer.z = remotePlayer.z = COMBAT_Z;
        lastSentMove = { x: localPlayer.x, z: COMBAT_Z, facingRight: localPlayer.facingRight };
        lastMoveEmitAt = 0;
        nextWeaponAt = 0;
        nextAttackAt = 0;

        const myName = data.myName || localStorage.getItem('littleWarrior.playerName') || '';
        document.getElementById('playerInfo').textContent = `我方 ${myName} (P${myPlayerNum})`.replace(/\s+/g, ' ');
        document.getElementById('opponentInfo').textContent = `对手 ${data.opponentName}`;

        localPlayer.health = localPlayer.maxHealth;
        remotePlayer.health = remotePlayer.maxHealth;
        updateHealthUI('player');
        updateHealthUI('opponent');

        initCharacters();
        updateWeaponPanel('player');
        updateWeaponPanel('opponent');
        scheduleNextDrop(clock.getElapsedTime());
        animate();
        runCountdown();
    }

    function runCountdown() {
        const overlay = document.getElementById('countdownOverlay');
        const text = document.getElementById('countdownText');
        overlay.style.display = 'flex';
        const steps = ['3', '2', '1', '开战!'];
        steps.forEach((s, i) => {
            setTimeout(() => {
                text.textContent = s;
                text.classList.remove('pop');
                void text.offsetWidth;
                text.classList.add('pop');
                audio.play(i < 3 ? 'count' : 'fight');
                if (i === steps.length - 1) {
                    canAct = true;
                    matchStartTime = clock.getElapsedTime();
                    setTimeout(() => { overlay.style.display = 'none'; }, 700);
                }
            }, i * 800);
        });
    }

    function startPracticeMode() {
        const name = playerNameInput.value.trim() || '匿名玩家';
        localStorage.setItem('littleWarrior.playerName', name);
        practiceMode = true;
        bot.nextAttackAt = 0;
        bot.nextWeaponAt = 0;
        bot.nextThinkAt = 0;
        bot.moveDir = 0;
        beginMatch({ roomId: 'practice', playerNum: 1, opponentName: '练习机器人 🤖', myName: name });
        showToast('练习模式：击败机器人！');
    }

    /* ═══════════════════════════════════════════
       UI FUNCTIONS
    ═══════════════════════════════════════════ */
    function updateHealthUI(who) {
        const p = who === 'player' ? localPlayer : remotePlayer;
        const pct = Math.max(0, (p.health / p.maxHealth) * 100);
        const fill = document.getElementById(who === 'player' ? 'playerFill' : 'opponentFill');
        const ghost = document.getElementById(who === 'player' ? 'playerGhost' : 'opponentGhost');
        const wrap = document.getElementById(who === 'player' ? 'playerBarWrap' : 'opponentBarWrap');
        fill.style.width = pct + '%';
        ghost.style.width = pct + '%';
        wrap.classList.toggle('low', pct <= 30 && pct > 0);
        document.getElementById(who === 'player' ? 'playerHpText' : 'opponentHpText').textContent = `${Math.round(p.health)}/${p.maxHealth}`;
        if (who === 'player') {
            document.getElementById('lowHpVignette').classList.toggle('on', pct <= 30 && pct > 0);
        }
    }

    function updateWeaponPanel(who, pulse = false) {
        const isPlayer = who === 'player';
        const prefix = isPlayer ? 'player' : 'opponent';
        const player = isPlayer ? localPlayer : remotePlayer;
        const w = weaponData[player.weapon] || weaponData[0];
        document.getElementById(`${prefix}WIcon`).textContent = w.icon;
        document.getElementById(`${prefix}WName`).textContent = w.name;
        document.getElementById(`${prefix}WDesc`).textContent = w.desc;
        document.getElementById(`${prefix}WPow`).textContent = w.power;
        document.getElementById(`${prefix}WRange`).textContent = w.range.toFixed(1);
        if (pulse) {
            const card = document.getElementById(`${prefix}WeaponCard`);
            card.classList.remove('pulse');
            void card.offsetWidth;
            card.classList.add('pulse');
        }
    }

    function showToast(msg) {
        const wrap = document.getElementById('toastWrap');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        wrap.appendChild(toast);
        setTimeout(() => toast.remove(), 2300);
    }

    document.getElementById('soundToggle').addEventListener('click', (e) => {
        e.preventDefault();
        const muted = audio.toggleMute();
        document.getElementById('soundToggle').textContent = muted ? '🔇' : '🔊';
    });
    if (audio.muted) document.getElementById('soundToggle').textContent = '🔇';

    /* ═══════════════════════════════════════════
       INPUT — 键盘 / 触屏 / 指针
       A/D 或 ←/→ 移动 · E/J/空格 攻击 · W/K/Shift 闪避 · Q 换武器
    ═══════════════════════════════════════════ */
    const keys = { left: false, right: false };
    const joystickState = { active: false, x: 0, y: 0 };

    document.addEventListener('keydown', (e) => {
        if (e.target && e.target.tagName === 'INPUT') return;
        const k = e.key.toLowerCase();
        if ([' ', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
        if (!gameStarted || !canAct || matchOver) return;
        switch (k) {
            case 'arrowleft': case 'a': keys.left = true; break;
            case 'arrowright': case 'd': keys.right = true; break;
            case 'e': case 'j': case ' ': doAttack(); break;
            case 'w': case 'k': case 'shift': doDodge(); break;
            case 'q': doWeaponSwitch(); break;
        }
    });
    document.addEventListener('keyup', (e) => {
        switch (e.key.toLowerCase()) {
            case 'arrowleft': case 'a': keys.left = false; break;
            case 'arrowright': case 'd': keys.right = false; break;
        }
    });

    // Joystick
    const joyZone = document.getElementById('joystickZone');
    const joyBase = joyZone.querySelector('.joy-base');
    const joyKnob = document.getElementById('joyKnob');
    let joyCenter = { x: 0, y: 0 };
    let joyTouchId = null;
    const joyMax = 62;

    joyZone.addEventListener('touchstart', (e) => { e.preventDefault();
        if (joystickState.active) return;
        const touch = e.changedTouches[0];
        const zoneRect = joyZone.getBoundingClientRect();
        joystickState.active = true;
        joyTouchId = touch.identifier;
        joyCenter = { x: touch.clientX, y: touch.clientY };
        joyBase.style.left = `${touch.clientX - zoneRect.left - 74}px`;
        joyBase.style.top = `${touch.clientY - zoneRect.top - 74}px`;
        joyBase.style.bottom = 'auto';
        joyZone.classList.add('active');
        handleJoy(e);
    }, { passive: false });
    joyZone.addEventListener('touchmove', (e) => { e.preventDefault(); handleJoy(e); }, { passive: false });
    joyZone.addEventListener('touchend', (e) => { e.preventDefault(); endJoy(e); }, { passive: false });
    joyZone.addEventListener('touchcancel', (e) => { e.preventDefault(); endJoy(e); }, { passive: false });

    function handleJoy(e) {
        if (!joystickState.active) return;
        const touch = Array.from(e.touches).find(t => t.identifier === joyTouchId);
        if (!touch) return;
        let dx = touch.clientX - joyCenter.x;
        let dy = touch.clientY - joyCenter.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > joyMax) { dx = dx / dist * joyMax; dy = dy / dist * joyMax; }
        joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        joystickState.x = dx / joyMax;
        joystickState.y = dy / joyMax;
    }

    function endJoy(e) {
        const ended = Array.from(e.changedTouches).some(t => t.identifier === joyTouchId);
        if (!ended) return;
        joystickState.active = false;
        joystickState.x = 0;
        joystickState.y = 0;
        joyTouchId = null;
        joyZone.classList.remove('active');
        joyKnob.style.transform = 'translate(-50%,-50%)';
    }

    // 动作按钮：指针事件同时兼容触屏与鼠标
    function bindActionButton(id, fn) {
        const el = document.getElementById(id);
        el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            el.classList.add('pressed');
            fn();
        });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
            el.addEventListener(ev, () => el.classList.remove('pressed')));
    }
    bindActionButton('attackBtn', doAttack);
    bindActionButton('dodgeBtn', doDodge);
    bindActionButton('weaponBtn', doWeaponSwitch);

    /* ═══════════════════════════════════════════
       GAME ACTIONS
    ═══════════════════════════════════════════ */
    let nextWeaponAt = 0;
    let nextAttackAt = 0;
    const weaponCooldownSeconds = 5;
    const ATTACK_COOLDOWN = 0.38;

    function getRandomWeaponIndex() {
        if (weaponData.length <= 1) return 0;
        let next = localPlayer.weapon;
        while (next === localPlayer.weapon) next = Math.floor(Math.random() * weaponData.length);
        return next;
    }

    function updateWeaponCooldownUI(time) {
        const btn = document.getElementById('weaponBtn');
        const label = document.getElementById('weaponCooldown');
        const overlay = document.getElementById('weaponCdOverlay');
        const remaining = Math.max(0, nextWeaponAt - time);
        const ratio = remaining / weaponCooldownSeconds;

        btn.classList.toggle('cooldown', remaining > 0.05);
        label.textContent = `${Math.ceil(remaining)}s`;
        overlay.style.background = remaining > 0.05
            ? `conic-gradient(rgba(0,0,0,0.62) ${ratio * 360}deg, transparent 0deg)`
            : 'none';
    }

    function doAttack() {
        if (!gameStarted || !canAct || matchOver || opponentLeft) return;
        const time = clock.getElapsedTime();
        if (localPlayer.attacking || time < nextAttackAt) return;
        audio.play('attack');
        const weapon = weaponData[localPlayer.weapon];
        localPlayer.attacking = true;
        localPlayer.attackStart = time;
        nextAttackAt = time + ATTACK_COOLDOWN;
        // 连击：1.15 秒内连续攻击推进连段，否则从第一段重新开始
        if (time > (localPlayer.comboResetAt || 0)) localPlayer.comboCount = 0;
        localPlayer.attackVariant = (localPlayer.comboCount || 0) % attackVariantCount(weapon);
        localPlayer.comboCount = (localPlayer.comboCount || 0) + 1;
        localPlayer.comboResetAt = time + 1.15;
        if (!practiceMode) socket.emit('gameAction', { roomId, action: { type: 'attack', facingRight: localPlayer.facingRight, weapon: localPlayer.weapon, combo: localPlayer.attackVariant } });
        if (char1) {
            if (weapon.kind === 'bow') spawnArrowEffect(char1, localPlayer.facingRight, localPlayer.weapon);
            else spawnSlashEffect(char1, localPlayer.facingRight, localPlayer.attackVariant);
        }
        // 练习模式机器人读招闪避
        if (practiceMode && Math.random() < 0.22 && !remotePlayer.dodging) botDodge();
        const dist = Math.abs(localPlayer.x - remotePlayer.x);
        if (weapon.kind !== 'bow' && dist < weapon.range) {
            const dmg = weapon.power;
            if (!practiceMode) socket.emit('gameAction', { roomId, action: { type: 'hit', damage: dmg } });
            if (char2) { spawnHitEffect(char2.position); cameraShake(0.15); hitStop(); }
            remotePlayer.health = Math.max(0, remotePlayer.health - dmg);
            remotePlayer.hurt = true;
            updateHealthUI('opponent');
            setTimeout(() => { remotePlayer.hurt = false; }, 300);
            if (remotePlayer.health <= 0) endGame(true);
        }
        setTimeout(() => { localPlayer.attacking = false; }, 420);
    }

    function doDodge() {
        if (!gameStarted || !canAct || matchOver || opponentLeft) return;
        if (localPlayer.dodging) return;
        audio.play('dodge');
        localPlayer.dodging = true;
        localPlayer.dodgeDir = localPlayer.facingRight ? -1 : 1;
        if (!practiceMode) socket.emit('gameAction', { roomId, action: { type: 'dodge', vx: localPlayer.dodgeDir * 14 } });
        setTimeout(() => { localPlayer.dodging = false; }, 400);
    }

    function doWeaponSwitch() {
        if (!gameStarted || !canAct || matchOver || opponentLeft) return;
        const time = clock.getElapsedTime();
        if (time < nextWeaponAt) return;
        audio.play('switch');
        localPlayer.weapon = getRandomWeaponIndex();
        nextWeaponAt = time + weaponCooldownSeconds;
        if (!practiceMode) socket.emit('gameAction', { roomId, action: { type: 'weapon', weapon: localPlayer.weapon } });
        if (char1) updateWeaponMesh(char1, localPlayer.weapon);
        const w = weaponData[localPlayer.weapon];
        showToast(`${w.icon} ${w.name} · ${w.desc}`);
        updateWeaponPanel('player', true);
        updateWeaponCooldownUI(time);
    }

    /* ═══════════════════════════════════════════
       PRACTICE BOT（练习模式 AI）
    ═══════════════════════════════════════════ */
    const bot = { moveDir: 0, nextThinkAt: 0, nextAttackAt: 0, nextWeaponAt: 0 };
    const BOT_SPEED = 7.2;

    function botDodge() {
        remotePlayer.dodging = true;
        remotePlayer.dodgeDir = remotePlayer.facingRight ? -1 : 1;
        audio.play('dodge');
        setTimeout(() => { remotePlayer.dodging = false; }, 400);
    }

    function botAttack(time) {
        const weapon = weaponData[remotePlayer.weapon];
        remotePlayer.attacking = true;
        remotePlayer.attackStart = time;
        remotePlayer.facingRight = localPlayer.x > remotePlayer.x;
        bot.nextAttackAt = time + 0.85 + Math.random() * 0.75;
        bot.comboCount = (bot.comboCount || 0) + 1;
        remotePlayer.attackVariant = bot.comboCount % attackVariantCount(weapon);
        audio.play('attack');
        if (char2) {
            if (weapon.kind === 'bow') spawnArrowEffect(char2, remotePlayer.facingRight, remotePlayer.weapon);
            else spawnSlashEffect(char2, remotePlayer.facingRight, remotePlayer.attackVariant);
        }
        const dist = Math.abs(localPlayer.x - remotePlayer.x);
        if (weapon.kind !== 'bow' && dist < weapon.range) {
            const dmg = weapon.power;
            localPlayer.health = Math.max(0, localPlayer.health - dmg);
            localPlayer.hurt = true;
            updateHealthUI('player');
            if (char1) { spawnHitEffect(char1.position); cameraShake(0.3); hitStop(); damageFlash(); popupAt(char1, -dmg); }
            audio.play('hurt');
            setTimeout(() => { localPlayer.hurt = false; }, 300);
            if (localPlayer.health <= 0) endGame(false);
        }
        setTimeout(() => { remotePlayer.attacking = false; }, 420);
    }

    function updateBot(dt, time) {
        if (!practiceMode || !gameStarted || matchOver || !canAct) return;
        const weapon = weaponData[remotePlayer.weapon];
        const dist = Math.abs(localPlayer.x - remotePlayer.x);
        const dirToPlayer = localPlayer.x > remotePlayer.x ? 1 : -1;

        // 思考：决定移动方向
        if (time >= bot.nextThinkAt) {
            bot.nextThinkAt = time + 0.28 + Math.random() * 0.3;
            const desired = weapon.range * (weapon.kind === 'bow' ? 0.72 : 0.62);
            if (dist > desired + 0.5) bot.moveDir = dirToPlayer;
            else if (dist < desired - 0.9) bot.moveDir = -dirToPlayer;
            else bot.moveDir = Math.random() < 0.35 ? (Math.random() < 0.5 ? 1 : -1) : 0;
        }

        // 闪避位移优先
        if (remotePlayer.dodging) {
            remotePlayer.x += remotePlayer.dodgeDir * 14 * dt;
        } else {
            remotePlayer.x += bot.moveDir * BOT_SPEED * dt;
        }
        remotePlayer.x = Math.max(ARENA_MIN, Math.min(ARENA_MAX, remotePlayer.x));
        remotePlayer.targetX = remotePlayer.x;
        remotePlayer.vx = remotePlayer.dodging ? remotePlayer.dodgeDir * 14 : bot.moveDir * BOT_SPEED;
        if (!remotePlayer.attacking) remotePlayer.facingRight = dirToPlayer > 0;

        // 攻击
        if (!remotePlayer.attacking && time >= bot.nextAttackAt && dist < weapon.range * 0.92) {
            botAttack(time);
        }

        // 定期换武器
        if (time >= bot.nextWeaponAt) {
            bot.nextWeaponAt = time + 6 + Math.random() * 3;
            remotePlayer.weapon = Math.floor(Math.random() * weaponData.length);
            if (char2) updateWeaponMesh(char2, remotePlayer.weapon);
            updateWeaponPanel('opponent', true);
        }
    }

    /* ═══════════════════════════════════════════
       GAME LOOP
    ═══════════════════════════════════════════ */
    const clock = new THREE.Clock();
    let lastMoveEmitAt = 0;
    let lastSentMove = { x: 0, z: 0, facingRight: true };
    const MOVE_SPEED = 9.6;   // 单位/秒（帧率无关）
    const DODGE_SPEED = 14;

    function updateLocalPlayer(dt, time) {
        if (!gameStarted || matchOver) return;
        if (!canAct) { localPlayer.vx = 0; return; }

        let inputDir = 0;
        if (keys.left) inputDir = -1;
        else if (keys.right) inputDir = 1;
        if (joystickState.active && Math.abs(joystickState.x) > 0.12) inputDir = joystickState.x;

        if (localPlayer.dodging) {
            localPlayer.vx = localPlayer.dodgeDir * DODGE_SPEED;
        } else if (inputDir !== 0) {
            localPlayer.vx = inputDir * MOVE_SPEED;
            if (inputDir > 0.2) localPlayer.facingRight = true;
            else if (inputDir < -0.2) localPlayer.facingRight = false;
        } else {
            // 松手后快速停稳
            localPlayer.vx *= Math.exp(-12 * dt);
            if (Math.abs(localPlayer.vx) < 0.05) localPlayer.vx = 0;
        }

        localPlayer.x += localPlayer.vx * dt;
        localPlayer.x = Math.max(ARENA_MIN, Math.min(ARENA_MAX, localPlayer.x));
        localPlayer.z = COMBAT_Z;

        if (practiceMode) return;
        const moved = Math.abs(localPlayer.x - lastSentMove.x) > 0.05;
        const turned = localPlayer.facingRight !== lastSentMove.facingRight;
        if (time - lastMoveEmitAt > 0.066 && (moved || turned || Math.abs(localPlayer.vx) > 0.3)) {
            socket.emit('gameAction', { roomId, action: { type: 'move', x: localPlayer.x, z: COMBAT_Z, vx: localPlayer.vx, vz: 0, facingRight: localPlayer.facingRight } });
            lastMoveEmitAt = time;
            lastSentMove = { x: localPlayer.x, z: COMBAT_Z, facingRight: localPlayer.facingRight };
        }
    }

    function updateCamera(dt, rawDt) {
        const midX = (localPlayer.x + remotePlayer.x) * 0.5;
        const spread = Math.min(13, Math.abs(localPlayer.x - remotePlayer.x));
        const slowMo = clock.getElapsedTime() < slowMoUntil;
        cameraTarget.set(midX, slowMo ? 1.7 : 1.55, COMBAT_Z);
        if (slowMo) cameraDesired.set(midX, 5.4, 8.2);
        else cameraDesired.set(midX, 8.4 + spread * 0.22, 12.2 + spread * 0.58);
        camera.position.lerp(cameraDesired, Math.min(1, rawDt * (slowMo ? 6 : 3.5)));
        if (shakeTimer > 0) {
            shakeTimer = Math.max(0, shakeTimer - rawDt);
            const falloff = shakeTimer / 0.28;
            camera.position.x += (Math.random() - 0.5) * shakePower * falloff;
            camera.position.y += (Math.random() - 0.5) * shakePower * 0.45 * falloff;
            shakePower *= 0.92;
        }
        // FOV 打击回弹
        if (fovKick > 0.01) {
            fovKick *= Math.exp(-8 * rawDt);
            camera.fov = 50 - fovKick;
            camera.updateProjectionMatrix();
        } else if (camera.fov !== 50) {
            camera.fov = 50;
            camera.updateProjectionMatrix();
        }
        camera.lookAt(cameraTarget);
    }

    function updateMatchTimer(time) {
        if (!matchStartTime || matchOver) return;
        const elapsed = Math.max(0, Math.floor(time - matchStartTime));
        const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const ss = String(elapsed % 60).padStart(2, '0');
        document.getElementById('matchTimer').textContent = `${mm}:${ss}`;
    }

    function animate() {
        if (!gameStarted) return;
        requestAnimationFrame(animate);

        const rawDt = Math.min(clock.getDelta(), 0.05);
        const time = clock.getElapsedTime();
        // 打击停顿 / KO 慢动作时间缩放
        let timeScale = 1;
        if (time < hitStopUntil) timeScale = 0.06;
        else if (time < slowMoUntil) timeScale = 0.3;
        const dt = rawDt * timeScale;

        updateLocalPlayer(dt, time);
        updateBot(dt, time);

        if (char1) {
            char1.position.x = localPlayer.x;
            char1.position.y = 0;
            char1.position.z = COMBAT_Z;
            animateCharacter(char1, localPlayer, time);
        }
        if (char2) {
            if (!practiceMode) remotePlayer.x += (remotePlayer.targetX - remotePlayer.x) * Math.min(1, rawDt * 15);
            char2.position.x = remotePlayer.x;
            char2.position.y = 0;
            char2.position.z = COMBAT_Z;
            animateCharacter(char2, remotePlayer, time);
        }

        // 草地风吹
        if (grassMat.userData.shader) grassMat.userData.shader.uniforms.uTime.value = time;

        // 花粉粒子漂浮
        const pAttr = particles.geometry.attributes.position;
        for (let i = 0; i < partCount; i++) {
            pAttr.array[i * 3 + 1] += Math.sin(time * 0.9 + partSeed[i]) * 0.0028;
            pAttr.array[i * 3] += Math.cos(time * 0.4 + partSeed[i]) * 0.0016;
        }
        pAttr.needsUpdate = true;

        // 云朵漂移 + 面向镜头
        clouds.forEach(cloud => {
            cloud.position.x += rawDt * cloud.userData.speed;
            cloud.position.y += Math.sin(time * 0.2 + cloud.userData.speed * 20) * 0.002;
            if (cloud.position.x > 38) cloud.position.x = -38;
        });

        updateEffects(dt);
        updateDrops(dt, time);
        updateWeaponCooldownUI(time);
        updateMatchTimer(time);
        updateCamera(dt, rawDt);
        renderer.render(scene, camera);
    }

    /* ═══════════════════════════════════════════
       GAME OVER
    ═══════════════════════════════════════════ */
    function endGame(iWon) {
        if (matchOver) return;
        matchOver = true;
        canAct = false;
        document.getElementById('lowHpVignette').classList.remove('on');
        // 败者倒地演出（配合 KO 慢动作）
        const loser = iWon ? remotePlayer : localPlayer;
        loser.dead = true;
        loser.deadAt = clock.getElapsedTime();
        loser.attacking = false;
        loser.dodging = false;
        // KO 慢动作，然后展示结算
        slowMoUntil = clock.getElapsedTime() + 1.25;
        audio.play(iWon ? 'win' : 'lose');
        setTimeout(() => {
            showGameOverScreen({
                emoji: iWon ? '🏆' : '💫',
                text: iWon ? '胜利！' : '惜败！',
                color: iWon ? '#51cf66' : '#ff8787',
                sub: iWon ? '漂亮的战斗，小战士！' : '再接再厉，下一局必胜！',
                confetti: iWon
            });
        }, 1350);
    }

    function showGameOverScreen({ emoji, text, color, sub, confetti = false }) {
        document.getElementById('gameOverEmoji').textContent = emoji;
        const textEl = document.getElementById('gameOverText');
        textEl.textContent = text;
        textEl.style.color = color;
        document.getElementById('gameOverSub').textContent = sub || '';
        document.getElementById('gameOverScreen').classList.add('show');
        if (confetti) spawnConfetti();
    }

    function spawnConfetti() {
        const box = document.getElementById('confettiBox');
        const shapes = ['🎉', '⭐', '✨', '🎊', '🏅'];
        for (let i = 0; i < 70; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            if (Math.random() < 0.4) {
                c.textContent = shapes[Math.floor(Math.random() * shapes.length)];
                c.style.fontSize = (12 + Math.random() * 16) + 'px';
            } else {
                const size = 6 + Math.random() * 8;
                c.style.width = size + 'px';
                c.style.height = size * (Math.random() < 0.5 ? 1 : 0.5) + 'px';
                c.style.background = `hsl(${Math.random() * 360}, 90%, 62%)`;
                c.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
            }
            c.style.left = Math.random() * 100 + 'vw';
            c.style.animationDuration = (2.2 + Math.random() * 2.6) + 's';
            c.style.animationDelay = (Math.random() * 0.9) + 's';
            box.appendChild(c);
            setTimeout(() => c.remove(), 5600);
        }
    }

    // Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    </script>
</body>
